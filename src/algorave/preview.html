<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chiptunes — algorave preview</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#101116;color:#e9e9ee}*{box-sizing:border-box}body{margin:0}header{height:60px;display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid #30313a}strong{margin-right:auto;font-weight:600}button,select{font:inherit;color:inherit;background:#232530;border:1px solid #454756;border-radius:6px;padding:7px 13px;cursor:pointer}button:hover{background:#333747}button:disabled{opacity:.45;cursor:wait}main{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 110px)}section{min-width:0;padding:20px}label{display:block;font-size:12px;color:#999fae;margin-bottom:12px}textarea{width:100%;height:calc(100vh - 180px);resize:none;border:0;outline:none;background:transparent;color:#dbdbe9;font:15px/1.7 ui-monospace,monospace;tab-size:2}textarea:focus-visible{outline:1px solid #7476c9;outline-offset:6px}#visual-editor{display:none}canvas{width:100%;aspect-ratio:16/9;object-fit:contain;background:#060610;border-radius:8px}#output{border-left:1px solid #30313a;display:flex;align-items:center}footer{padding:10px 20px;color:#a4a8b5;font-size:13px}#status{white-space:pre-wrap}body[data-mode=visuals] #music-editor{display:none}body[data-mode=visuals] #visual-editor{display:block}body[data-mode=both] main{grid-template-columns:1fr 1fr 1fr}body[data-mode=both] #visual-editor{display:block}small{font-size:11px;color:#a4a8b5}@media(max-width:800px){main,body[data-mode=both] main{grid-template-columns:1fr}textarea{height:32vh}#output{border-left:0}header{padding:10px;gap:6px}button,select{padding:7px}strong{font-size:13px}small{display:none}}
</style></head><body data-mode="music"><header><strong>chiptunes <small>local runtime proof</small></strong><select id="mode" aria-label="Editor view"><option value="music">Music</option><option value="visuals">Visuals</option><option value="both">Both</option></select><button id="play" disabled>Play</button><button id="run" disabled>Run</button></header>
<main><section id="music-editor"><label for="music">Strudel</label><textarea id="music" spellcheck="false" wrap="off" aria-label="Strudel music"></textarea></section><section id="visual-editor"><label for="visual">GLSL · Image</label><textarea id="visual" spellcheck="false" wrap="off" aria-label="GLSL visual"></textarea></section><section id="output"><canvas id="canvas" width="960" height="540" aria-label="Visual output"></canvas></section></main><footer><span id="status" role="status">Starting music engine…</span> <small id="build"></small></footer>
<script src="workspace.js"></script></body></html>
