<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0814" />
<title>Retro Rave Radio</title>
<!-- static fallback favicon (Safari ignores the JS/canvas reactive favicon; this is what it + any browser shows pre-start) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='rgb(10,8,20)'/><path d='M16 27C16 27 4.5 19 4.5 11C4.5 7.4 7.2 5 10.3 5C13 5 15 6.8 16 8.8C17 6.8 19 5 21.7 5C24.8 5 27.5 7.4 27.5 11C27.5 19 16 27 16 27Z' fill='rgb(248,43,99)'/><path d='M10.6 9.2C12.1 9.2 13.3 10.2 13.7 11.4' stroke='rgba(255,255,255,0.55)' stroke-width='1.7' fill='none' stroke-linecap='round'/></svg>" />
<link rel="mask-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 27C16 27 4.5 19 4.5 11C4.5 7.4 7.2 5 10.3 5C13 5 15 6.8 16 8.8C17 6.8 19 5 21.7 5C24.8 5 27.5 7.4 27.5 11C27.5 19 16 27 16 27Z'/></svg>" color="#f878f8" />

<script>
(function(){
  // player-route boot: hide the Home overlay pre-paint for direct track/watch/radio links.
  // /track/<slug> (generated; slug may carry a '<composerId>.' prefix)
  // /watch (silent wallpaper) · /radio (mints a fresh generated track).
  var path=(location.pathname||'/').replace(/^\/+|\/+$/g,''), slug=path;
  try{ slug=decodeURIComponent(slug); }catch(e){}
  slug=String(slug||'').toLowerCase();
  var parts=slug.split('/').filter(Boolean);
  var aiTrackRoute=!!(parts[0]==='track' && parts[1] && !parts[2] && /^[a-z0-9][a-z0-9._-]*$/.test(parts[1]));
  var modeRoute=(parts.length===1 && (parts[0]==='watch' || parts[0]==='radio'));
  if(aiTrackRoute || modeRoute){
    document.documentElement.classList.add('boot-player-route');
    window.__RRR_BOOT_PLAYER_ROUTE=true;
  }
})();
</script>
<style>
  :root{
    --bg:#0a0814;
    --ink:#fcfcf8;
    --accent:#f878f8;
    --accent2:#58f898;
    --accent3:#6888fc;
    --pixel:'VT323',"Courier New",ui-monospace,Menlo,Consolas,monospace;   /* legible pixel/CRT font */
    --mono:ui-monospace,Menlo,Consolas,monospace;                          /* aligned data dumps stay plain monospace */
    --navw:300px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; width:100%; overflow:hidden; background:var(--bg); }
  html.boot-player-route #intro{ display:none !important; }
  body{
    font-family:var(--pixel);
    color:var(--ink);
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    cursor:crosshair;
  }
  #stage{ position:fixed; inset:0; display:block; }
  html.audio-background #stage,
  html.audio-background .crt,
  html.audio-background #hud,
  html.audio-background #presets,
  html.audio-background #now,
  html.audio-background #playbar,
  html.audio-background #rlist,
  html.audio-background #rfullscreen,
  html.audio-background #mixpanel,
  html.audio-background #trackpanel,
  html.audio-background #pbMenu,
  html.audio-background #gamepick{
    visibility:hidden !important;
  }

  /* CRT overlays */
  .crt{ position:fixed; inset:0; pointer-events:none; z-index:5; }
  .scanlines{
    background:
      repeating-linear-gradient( to bottom,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.28) 2px, rgba(0,0,0,0.28) 4px),
      repeating-linear-gradient( to right,
        rgba(255,0,0,0.04) 0px, rgba(0,255,0,0.03) 1px, rgba(0,0,255,0.04) 2px);
    mix-blend-mode:multiply; opacity:.6;
  }
  .vignette{
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 46%, rgba(0,0,0,.62) 100%);
    box-shadow: inset 0 0 140px 30px rgba(0,0,0,.45);
  }

  /* HUD */
  #hud{
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    display:flex; gap:12px; align-items:center; justify-content:space-between;
    padding:9px 12px; pointer-events:none;
    opacity:0; transition:opacity .6s ease;
  }
  #hud.show{ opacity:.95; }
  #trackname{ font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#bdb0e8;
    text-shadow:0 0 6px rgba(120,100,200,.5); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #trackname b{ color:var(--accent2); font-weight:700; }
  #trackname .sub{ color:#6f679a; }
  #transport{ display:flex; gap:6px; pointer-events:auto; flex:0 0 auto; }
  .btn{
    pointer-events:auto; cursor:pointer;
    background:rgba(20,16,40,.7); color:var(--ink);
    border:2px solid #3a2f66; padding:8px 14px;
    font:inherit; font-size:17px; letter-spacing:1px; text-transform:uppercase;
    box-shadow:0 0 0 2px #0a0814, 3px 3px 0 #2a2150;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn svg{ width:18px; height:18px; }
  .btn:hover{ border-color:var(--accent); color:var(--accent); }
  .btn.on{ border-color:var(--accent2); color:var(--accent2); }

  /* Preset selector (top bar) */
  #presets{
    position:fixed; top:0; left:0; right:0; z-index:6;
    display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap;
    padding:10px; pointer-events:none;
    opacity:0; transition:opacity .6s ease;
  }
  #presets.show{ opacity:1; }
  .preset{
    pointer-events:auto; cursor:pointer;
    background:rgba(16,12,32,.72); color:#9a90c0;
    border:2px solid #2f2752; padding:7px 12px;
    font:inherit; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    box-shadow:3px 3px 0 #1a1436;
    transition:color .15s, border-color .15s, transform .1s;
  }
  .preset:hover{ color:var(--ink); transform:translateY(-2px); }
  .preset.sel{ color:#0a0814; background:var(--accent2); border-color:var(--accent2);
    box-shadow:3px 3px 0 #1a6a48, 0 0 18px rgba(88,248,152,.4); }
  .preset.random{ color:#fcd86a; border-color:#7a5a1a; }
  .preset.random.sel{ color:#1a1000; background:#fcd86a; border-color:#fcd86a;
    box-shadow:3px 3px 0 #6a4a10, 0 0 18px rgba(252,216,106,.5); }
  #now{
    position:fixed; top:52px; left:0; right:0; z-index:6; text-align:center;
    font-size:15px; letter-spacing:2px; text-transform:uppercase; color:#6f679a;
    pointer-events:none; opacity:0; transition:opacity .6s ease;
  }
  #now.show{ opacity:.85; }

  /* Radio player bar (replaces game tabs) */
  #presets{ flex-wrap:nowrap; gap:6px; padding:8px; overflow-x:auto; }
  .rbtn{ pointer-events:auto; cursor:pointer; background:rgba(20,16,40,.85); color:var(--ink);
    border:2px solid #3a2f66; min-width:38px; height:34px; font:inherit; font-size:20px; box-shadow:2px 2px 0 #1a1436;
    display:inline-flex; align-items:center; justify-content:center; }
  .rbtn svg{ width:22px; height:22px; display:block; }                  /* SVG icons (no emoji) inherit currentColor */
  .rbtn:hover{ border-color:var(--accent); color:var(--accent); }
  .rbtn:disabled{ opacity:.36; cursor:default; color:#726b91; border-color:#2f2752; box-shadow:2px 2px 0 #1a1436; }
  .rbtn:disabled:hover{ border-color:#2f2752; color:#726b91; }
  .rbtn.up.act{ border-color:var(--accent2); color:var(--accent2); }
  .rbtn.down.act{ border-color:#f85858; color:#f85858; }
  .rbtn.on{ border-color:var(--accent2); color:var(--accent2); box-shadow:2px 2px 0 #1a6a48; }   /* selected tempo preset */
  #rtempo{ display:flex; align-items:center; gap:4px; pointer-events:auto; }   /* no container box — just the BPM button */
  #rlist{ position:fixed; top:8px; left:8px; z-index:14; }                       /* welcome/menu toggle -> TOP-LEFT corner */
  #rlist.on{ border-color:var(--accent); color:var(--accent); }
  #rfullscreen{
    display:none; position:fixed; top:14px; right:18px; z-index:24; align-items:center; justify-content:center;
    min-height:34px; min-width:34px; padding:7px; border-radius:999px; border:1px solid rgba(255,255,255,.12);
    background:rgba(8,6,16,.42); color:rgba(255,255,255,.92); cursor:pointer; pointer-events:auto;
    text-shadow:0 1px 8px rgba(0,0,0,.65); box-shadow:0 8px 28px rgba(0,0,0,.22);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    opacity:0; transform:translateY(-6px); transition:opacity .22s ease, transform .22s ease, border-color .12s, color .12s, background .12s;
  }
  #rfullscreen:hover, #rfullscreen.on{ border-color:rgba(248,120,248,.62); color:#fff; background:rgba(24,18,48,.58); }
  #rfullscreen svg{ width:16px; height:16px; flex:0 0 auto; }
  #rfullscreen.unsupported{ display:none !important; }
  body.is-fullscreen #rlist,
  body.is-fullscreen #rfullscreen,

  /* Visualizer picker opened by the G key. This is testing chrome, not game UI. */
  #gamepick{ position:fixed; inset:0; z-index:10040; display:none; align-items:center; justify-content:center;
    padding:22px; background:rgba(5,4,12,.52); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  #gamepick.show{ display:flex; }
  #gamepick .gp-panel{ width:min(620px,calc(100vw - 28px)); max-height:min(720px,calc(100dvh - 34px)); overflow:hidden;
    background:rgba(10,8,20,.96); border:1px solid rgba(207,199,240,.18); border-radius:14px;
    box-shadow:0 24px 80px rgba(0,0,0,.68),0 0 38px rgba(248,120,248,.12); color:#fff; }
  #gamepick .gp-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:18px; padding:18px 18px 14px;
    border-bottom:1px solid rgba(207,199,240,.12); }
  #gamepick .gp-title{ font:800 18px/1.15 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:0; }
  #gamepick .gp-sub{ margin-top:4px; color:#a99fc9; font:600 12px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:0; }
  #gamepick .gp-close{ flex:0 0 auto; width:34px; height:34px; border:0; border-radius:50%; cursor:pointer;
    background:rgba(255,255,255,.08); color:#e9e4ff; font:700 22px/1 system-ui,-apple-system,sans-serif; }
  #gamepick .gp-close:hover{ background:rgba(255,255,255,.14); color:#fff; }
  #gamepick .gp-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:10px; padding:14px 18px 18px;
    max-height:calc(min(720px,100dvh - 34px) - 82px); overflow:auto; }
  #gamepick .gp-item{ min-height:58px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer;
    border:1px solid rgba(207,199,240,.14); border-radius:10px; background:rgba(255,255,255,.055); color:#f6f2ff;
    padding:11px 12px; text-align:left; font:800 15px/1.15 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #gamepick .gp-item:hover{ border-color:rgba(248,120,248,.56); background:rgba(248,120,248,.11); }
  #gamepick .gp-item.active{ border-color:rgba(88,248,152,.74); background:rgba(88,248,152,.12); color:#fff; }
  #gamepick .gp-key{ display:block; margin-top:3px; color:#8f86b8; font:700 11px/1.2 var(--mono); }
  #gamepick .gp-dot{ width:10px; height:10px; border-radius:50%; background:transparent; border:1px solid rgba(207,199,240,.34); flex:0 0 auto; }
  #gamepick .gp-item.active .gp-dot{ background:var(--accent2); border-color:var(--accent2); box-shadow:0 0 12px rgba(88,248,152,.45); }

  /* Intro */
  #intro{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px; padding:24px;
    background:none; isolation:isolate;
    transition:opacity .5s ease;
  }
  #intro::before{
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at center,#160f2e 0%,#0a0814 70%);
    opacity:1; transition:opacity .22s ease;
  }
  body.song-visual #intro:not(.lib)::before,
  body.ai-visual #intro:not(.lib)::before{ opacity:.8; }
  #intro > *{ position:relative; z-index:1; }
  #intro .intro-hero{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    max-width:min(760px,92vw); padding:8px 12px 2px;
  }
  #intro h1{
    font-size:clamp(30px,7vw,60px); line-height:1; font-weight:700;
    letter-spacing:2px;
    color:var(--ink);
    text-shadow:
      4px 4px 0 #a80020,
      8px 8px 0 #0000fc,
      0 0 24px rgba(248,120,248,.45);
  }
  #intro .sub{ max-width:620px; font:650 clamp(15px,2.8vw,22px)/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#ddd7f4; letter-spacing:0; text-transform:none; }
  #intro .keys{ font-size:12px; color:#6f679a; letter-spacing:1px; max-width:520px; line-height:1.9; }
  #intro .keys b{ color:var(--accent2); }
  /* HOME station chooser — Nintendo-style: big chunky color-coded tiles,
     oversized pixel characters, bouncy hover. Each card carries its own
     accent via --stc (set inline per station). */
  #hometiles{ display:block; width:min(1240px,95vw); max-height:74vh; overflow-y:auto; padding:6px; }
  #hometiles .stlabel{ font-family:var(--pixel); font-size:clamp(17px,2vw,22px); letter-spacing:2.5px; color:#d8cff6; margin:0 2px 22px; text-align:center; text-shadow:0 2px 12px rgba(120,80,220,.35); }
  #hometiles .strow{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(14px,1.8vw,24px); }
  @media (max-width:980px){ #hometiles .strow{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:480px){ #hometiles .strow{ grid-template-columns:1fr; } }
  .hometile{ --stc:#8f7ae0;
    pointer-events:auto; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center;
    min-height:clamp(240px,30vh,300px); background:linear-gradient(180deg, rgba(30,24,56,.92), rgba(16,12,32,.94));
    color:var(--ink); border:3px solid #342a5e; border-radius:22px; padding:28px 20px 26px;
    font-family:var(--pixel); box-shadow:0 7px 0 #14102c, 0 16px 34px rgba(0,0,0,.4);
    transition:transform .16s cubic-bezier(.2,1.6,.4,1), border-color .16s, box-shadow .16s, background .16s; }
  .hometile:hover{ border-color:var(--stc); transform:translateY(-7px) scale(1.035);
    box-shadow:0 13px 0 #14102c, 0 26px 54px rgba(0,0,0,.45), 0 0 42px color-mix(in srgb, var(--stc) 38%, transparent);
    background:linear-gradient(180deg, rgba(38,30,70,.95), rgba(18,14,38,.96)); }
  .hometile:active{ transform:translateY(-2px) scale(1.01); box-shadow:0 5px 0 #14102c, 0 12px 26px rgba(0,0,0,.4); }
  .hometile .htico{ flex:0 0 auto; width:108px; height:108px; display:flex; align-items:center; justify-content:center; color:var(--stc);
    filter:drop-shadow(0 7px 0 rgba(0,0,0,.32)); }
  .hometile .htico svg{ width:72px; height:72px; }
  .hometile .htchar{ width:96px; height:96px; image-rendering:pixelated; image-rendering:crisp-edges; }
  .hometile:hover .htchar{ animation:st-bounce .55s cubic-bezier(.28,1.7,.4,1); }
  @keyframes st-bounce{ 0%{transform:translateY(0) scale(1);} 35%{transform:translateY(-14px) scale(1.1);} 65%{transform:translateY(2px) scale(.98);} 100%{transform:translateY(0) scale(1.06);} }
  .hometile .httxt{ display:flex; flex-direction:column; gap:9px; min-width:0; align-items:center; }
  .hometile .htname{ font-size:clamp(20px,1.9vw,26px); letter-spacing:1px; line-height:1.1; color:var(--stc); text-shadow:0 2px 0 rgba(0,0,0,.4); }
  .hometile .htdesc{ font:650 15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#c9c1e6; text-transform:none; letter-spacing:0; white-space:normal; overflow:visible; text-overflow:clip; max-width:24ch; }
  .hometile.staged{ opacity:.5; }
  .hometile.staged:hover{ opacity:.72; border-color:#3a2f66; transform:none; }
  #intro.product-home{ justify-content:center; align-items:center; gap:18px; overflow:hidden; padding:48px 22px 104px; }
  /* ===== WATCH CHROME: pointer-reveal strip (Home · game picker · mic), auto-hides via controls-active ===== */
  #watchbar{
    position:fixed; top:14px; left:50%; transform:translate(-50%,-6px); z-index:24;
    display:none; align-items:center; gap:8px; padding:6px; border-radius:999px;
    background:rgba(8,6,16,.52); border:1px solid rgba(255,255,255,.12);
    box-shadow:0 10px 32px rgba(0,0,0,.34); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    opacity:0; pointer-events:none; transition:opacity .22s ease, transform .22s ease;
  }
  #watchbar button{
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px;
    min-height:34px; padding:7px 13px; border:0; border-radius:999px; background:transparent;
    color:rgba(255,255,255,.92); font:650 13px/1.25 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    letter-spacing:0; text-transform:none; text-shadow:0 1px 8px rgba(0,0,0,.65);
  }
  #watchbar button:hover{ background:rgba(255,255,255,.12); color:#fff; }
  #watchbar button svg{ width:16px; height:16px; flex:0 0 auto; }
  body.watch-visual #watchbar{ display:inline-flex; }
  body.watch-visual.controls-active #watchbar{ opacity:1; pointer-events:auto; transform:translate(-50%,0); }
  body.watch-mic-active #watchbar #wbMic{ color:#60ff9a; background:rgba(11,36,24,.56); box-shadow:0 0 18px rgba(96,255,154,.22); }
  @media (max-width:760px){
    #watchbar{ top:10px; max-width:calc(100vw - 16px); }
    #watchbar button{ padding:7px 10px; font-size:12px; }
    #watchbar button span{ display:none; }
  }
  /* ===== TikTok-style layout: caption bottom-left, action rail bottom-right ===== */
  #stage{ will-change:transform; }
  #hud{ align-items:flex-end; padding:0; }            /* children pin to the corners */
  /* caption (current track name), bottom-left */
  #trackname{ position:fixed; left:16px; bottom:18px; max-width:64vw;
    font-size:23px; letter-spacing:.3px; text-transform:none; color:#fff; font-weight:600;
    text-shadow:0 1px 5px rgba(0,0,0,.85); line-height:1.25; white-space:normal;
    display:flex; align-items:center; flex-wrap:wrap;
    pointer-events:auto; cursor:pointer; }                       /* click = expand the track details */
  #trackname .note{ color:var(--accent2); margin-right:8px; display:inline-flex; }
  #trackname .note svg{ width:20px; height:20px; }
  #trackname .ttl{ color:#fff; font-weight:700; }
  #trackname:hover .ttl{ text-decoration:underline; }
  #trackname .more{ margin-left:11px; font-size:16px; font-weight:700; color:#bdb0e8; opacity:.72; text-transform:uppercase; letter-spacing:.5px; display:inline-flex; align-items:center; gap:3px; }
  #trackname .more svg{ width:15px; height:15px; }
  #trackname .sub{ display:none; }                    /* no bpm/game/genre subtitle */
  /* tempo group hosted inside the mix menu */
  #mixtemposlot #rtempo{ display:flex; align-items:center; gap:8px; flex-wrap:nowrap; width:100%; }
  #mixtemposlot #rtemposlider{ flex:1 1 auto; min-width:120px; }
  #rlist svg{ width:24px; height:24px; }
  /* vertical action rail, bottom-right */
  #transport{ position:fixed; right:12px; bottom:20px; flex-direction:column; gap:15px; align-items:center; }
  #transport .rbtn{ width:54px; height:54px; min-width:54px; border-radius:50%; padding:0;
    display:flex; align-items:center; justify-content:center; line-height:1;
    background:rgba(18,14,36,.5); color:#fff; border:2px solid rgba(150,130,220,.28);
    box-shadow:0 3px 12px rgba(0,0,0,.45); transition:transform .12s, border-color .15s, color .15s; }
  #transport .rbtn:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }
  #transport .rbtn svg{ width:30px; height:30px; display:block; image-rendering:pixelated; }
  /* desktop prev/next: a vertically-centred pair on the right edge (TikTok-desktop position) */
  #radionav{ display:none; position:fixed; right:14px; top:50%; transform:translateY(-50%); z-index:8; flex-direction:column; gap:14px; }
  #radionav .rbtn{ width:50px; height:50px; min-width:50px; border-radius:50%; padding:0; display:flex; align-items:center; justify-content:center;
    background:rgba(18,14,36,.5); color:#fff; border:2px solid rgba(150,130,220,.28); box-shadow:0 3px 12px rgba(0,0,0,.45); transition:transform .12s,border-color .15s,color .15s; }
  #radionav .rbtn:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }
  #radionav .rbtn svg{ width:26px; height:26px; }
