<script>
(function(){
  var shellMode='';
  try{ shellMode=new URLSearchParams(location.search||'').get('mode')||''; }catch(e0){}
  // wallpaper mode is an ELECTRON-only presentation (all chrome + the cursor are hidden). Gate it on
  // the native bridge so a bare ?mode=wallpaper on the public web can't strip the UI for a visitor.
  var isDesktopHost=!!(window.RRRNative && window.RRRNative.isDesktop);
  if(shellMode==='wallpaper' && isDesktopHost){
    document.documentElement.classList.add('wallpaper-mode','boot-player-route');
    window.__RRR_WALLPAPER_MODE=true;
    window.__RRR_BOOT_PLAYER_ROUTE=true;
  } else if(shellMode==='popover' && isDesktopHost){
    document.documentElement.classList.add('popover-mode','boot-player-route');
    window.__RRR_POPOVER_MODE=true;
    window.__RRR_BOOT_PLAYER_ROUTE=true;
  } else if(shellMode==='browse' && isDesktopHost){
    document.documentElement.classList.add('browse-mode','boot-player-route');
    window.__RRR_BROWSE_MODE=true;
    window.__RRR_BOOT_PLAYER_ROUTE=true;
  }
  // player-route boot: hide the Home overlay pre-paint for direct track/watch/radio links.
  // /track/<slug> (generated; slug may carry a '<composerId>.' prefix)
  // /watch (silent wallpaper) · /radio (mints a fresh generated track).
  var path=(location.pathname||'/').replace(/^\/+|\/+$/g,''), slug=path;
  try{ slug=decodeURIComponent(slug); }catch(e){}
  slug=String(slug||'').toLowerCase();
  var parts=slug.split('/').filter(Boolean);
  var aiTrackRoute=!!(parts[0]==='track' && parts[1] && !parts[2] && /^[a-z0-9][a-z0-9._-]*$/.test(parts[1]));
  var modeRoute=(parts.length===1 && (parts[0]==='watch' || parts[0]==='radio' || parts[0]==='gameboy' || parts[0]==='create'));
  // The ROOT is a player route. The station used to open on a page listing the
  // ways to listen, with the game running muted behind it; you had to press
  // Listen now to get to the thing the page was describing. It starts now, and
  // the platform page moved to /get for the one pill that needs it.
  var rootRoute=(parts.length===0);
  if(aiTrackRoute || modeRoute || rootRoute){
    document.documentElement.classList.add('boot-player-route');
    window.__RRR_BOOT_PLAYER_ROUTE=true;
  }
  // The station's address is chiptunes.app, not chiptunes.app/radio. /radio
  // still serves it -- the link is in the wild and the stream directories carry
  // it -- but it rewrites to the root before first paint so the bar agrees.
  if(parts.length===1 && parts[0]==='radio'){
    try{ history.replaceState(null,'','/'+(location.search||'')+(location.hash||'')); }catch(e2){}
  }
})();
</script>
<style>

  /* self-hosted; see assets/fonts/README.md */
  @font-face{ font-family:'Press Start 2P'; font-style:normal; font-weight:400;
    font-display:swap; src:url('/fonts/press-start-2p.woff2') format('woff2'); }
  @font-face{ font-family:'Silkscreen'; font-style:normal; font-weight:400;
    font-display:swap; src:url('/fonts/silkscreen.woff2') format('woff2'); }
  @font-face{ font-family:'Silkscreen'; font-style:normal; font-weight:700;
    font-display:swap; src:url('/fonts/silkscreen.woff2') format('woff2'); }
  :root{
    --bg:#0a0814;
    --ink:#fcfcf8;
    /* OFF THE ACTUAL PLASTIC. The A and B buttons of a DMG-01 are burgundy, the
       screen is four greens, the D-pad is near-black and the shell is warm
       grey. These are those, and they are what the controls are coloured with
       now -- the palette was a generic synthwave pink and purple, which is the
       wrong decade and the wrong machine. */
    --gb-button:#8b2252;            /* A / B */
    --gb-button-hi:#a8306a;
    --gb-screen-0:#9bbc0f;          /* the four LCD tones, lightest to darkest */
    --gb-screen-1:#8bac0f;
    --gb-screen-2:#306230;
    --gb-screen-3:#0f380f;
    --gb-shell:#c6c2b4;             /* the warm grey shell */
    --gb-shell-dk:#8b8a7e;
    --gb-dpad:#2b2b30;
    --gb-led:#c4382e;               /* the power lamp */
    --accent:#f878f8;
    --accent2:#58f898;
    --accent3:#6888fc;
    /* THE HARDWARE'S OWN TYPE. --pixel named VT323 for a long time and VT323 was
       never bundled, so every use of it fell through to Courier New: the look
       was declared and never once rendered. Two faces now, both self-hosted and
       both SIL OFL (assets/fonts/OFL.txt), because the Electron app and the
       wallpaper run offline and a webfont that 404s off-network falls back to a
       proportional face and silently undoes the whole thing.
         --pixel  Press Start 2P: the display face. Enormous per character, so
                  it is for the name and nothing else.
         --px     Silkscreen: drawn FOR small sizes, which is what a button
                  label is. This carries the controls.
       Prose stays on --ui. A pixel face is a costume; a paragraph set in one is
       a wall, and the subtitle and the how-it-works panel are there to be read. */
    --pixel:'Press Start 2P','Silkscreen',"Courier New",ui-monospace,monospace;
    --px:'Silkscreen','Press Start 2P',ui-monospace,Menlo,Consolas,monospace;
    /* ONE SIZE FOR UI TEXT. Every label had been set individually, against
       whatever it happened to sit next to, so the page carried 15, 16 and 17px
       at once and the odd 12 -- which reads as some things being quietly less
       important than others. It is one number now; the only text that departs
       from it is the hero's name (a display face doing a display job) and the
       type inside the desktop thumbnail (scenery in a picture, not text). */
    --txt:17px;
    /* ONE BUTTON, TOO. The page carried 32, 34, 38, 46, 48 and 52px buttons at
       once, each chosen against whatever it sat beside -- a control being in a
       narrower strip is not a reason for it to be a different object. One
       height, one horizontal padding, one gap between a glyph and its label,
       everywhere. Icon-only buttons are the same height, square. */
    --btn-h:48px;
    --btn-px:20px;
    --btn-gap:9px;
    --mono:ui-monospace,Menlo,Consolas,monospace;                          /* aligned data dumps stay plain monospace */
    --ui:-apple-system,"SF Pro Display","SF Pro Text",system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;   /* Apple system stack — headings, body, buttons */
    --navw:300px;
    /* THE MATERIAL. Every floating surface over the game uses this one recipe.
       It used to be 52% dark, which is fine over a dark game and falls apart
       over a light one: on the Game Boy screen (cream) a 52% pill lands at
       about rgb(112,99,74), and the old #d9d3ee label on that is 3.55:1 --
       under the 4.5:1 floor, which is exactly why none of it was legible.
       At 82% the same label is ~12:1 over any screen the station can show. */
    --mat:rgba(10,8,18,.82);
    --mat-hi:rgba(30,23,58,.9);
    --mat-edge:rgba(255,255,255,.16);
    --mat-edge-hi:rgba(255,255,255,.32);
    --mat-blur:blur(20px) saturate(180%);
    --mat-shadow:0 8px 28px rgba(0,0,0,.45);
    --ink:#f4f1fb;                  /* primary label */
    --ink-2:rgba(232,227,250,.82);  /* secondary / body */
    /* The chrome DISSOLVES rather than waiting three seconds and vanishing.
       Slow out, so the fade itself is the countdown and you can see it coming;
       near-instant back, because feedback on input must never lag (the return
       trip is the one a person is waiting on). */
    --fade-out:.42s cubic-bezier(.4,0,.85,.4);   /* the 3s wait is a TIMER again, not this */
    --fade-in:.13s ease-out;
  }
  /* Legibility settings are not decoration: make the material solid rather than
     thinner, and keep the contrast the user asked for. */
  @media (prefers-reduced-transparency: reduce){
    :root{ --mat:rgba(9,7,16,.97); --mat-hi:rgba(30,23,58,.98); --mat-blur:none; }
  }
  @media (prefers-contrast: more){
    :root{ --mat:rgba(5,4,11,.98); --mat-hi:rgba(30,23,58,.99);
      --mat-edge:rgba(255,255,255,.55); --mat-edge-hi:rgba(255,255,255,.75);
      --ink:#fff; --ink-2:rgba(255,255,255,.94); }
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; width:100%; overflow:hidden; background:var(--bg); }
  html.boot-player-route #intro{ display:none !important; }
  html.wallpaper-mode body, html.wallpaper-mode body *{ cursor:none !important; }
  html.wallpaper-mode #intro,
  html.wallpaper-mode #hud,
  html.wallpaper-mode #presets,
  html.wallpaper-mode #playbar,
  html.wallpaper-mode #watchbar,
  html.wallpaper-mode #radionav,
  html.wallpaper-mode #rlist,
  html.wallpaper-mode #rfullscreen,
  html.wallpaper-mode #resumeMusic,
  html.wallpaper-mode #mixpanel,
  html.wallpaper-mode #trackpanel,
  html.wallpaper-mode #gamepick,
  html.wallpaper-mode #soundhint{ display:none !important; }
  /* Electron menu-bar popover: hide the whole radio UI, show only the compact control panel. */
  html.popover-mode #stage, html.popover-mode .crt, html.popover-mode #hearts,
  html.popover-mode #presets, html.popover-mode #hud, html.popover-mode #playbar,
  html.popover-mode #intro, html.popover-mode #watchbar, html.popover-mode #radionav,
  html.popover-mode #rlist, html.popover-mode #rfullscreen, html.popover-mode #mixpanel,
  html.popover-mode #trackpanel, html.popover-mode #gamepick,
  html.popover-mode #soundhint, html.popover-mode #resumeMusic{ display:none !important; }
  html.popover-mode, html.popover-mode body{ background:transparent !important; cursor:default; overflow:hidden; }
  #popover{ display:none; }
  html.popover-mode #popover{ display:block; }
  /* Electron desktop control-center window (Portal-style browse). */
  html.browse-mode #stage, html.browse-mode .crt, html.browse-mode #hearts,
  html.browse-mode #presets, html.browse-mode #hud, html.browse-mode #playbar,
  html.browse-mode #intro, html.browse-mode #watchbar, html.browse-mode #radionav,
  html.browse-mode #rlist, html.browse-mode #rfullscreen, html.browse-mode #mixpanel,
  html.browse-mode #trackpanel, html.browse-mode #gamepick,
  html.browse-mode #soundhint, html.browse-mode #resumeMusic{ display:none !important; }
  html.browse-mode, html.browse-mode body{ background:var(--bg) !important; cursor:default; overflow:auto; height:auto; min-height:100%; }
  #browse{ display:none; }
  html.browse-mode #browse{ display:block; }
  body{
    font-family:var(--pixel);
    color:var(--ink);
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    cursor:default;
  }
  /* THE BAR OWNS THE BOTTOM. The stage used to be inset:0 and sized from
     innerHeight, so the game ran underneath the player bar and the bottom of
     the picture was permanently behind it. --barh is the bar's measured height
     (0 when it is not shown: wallpaper, popover, browse), and everything that
     is "the picture" stops there. */
  #stage{ position:fixed; inset:0 0 var(--barh,0px) 0; display:block; }
  html.audio-background #stage,
  html.audio-background .crt,
  html.audio-background #hud,
  html.audio-background #presets,
  html.audio-background #now,
  html.audio-background #rlist,
  html.audio-background #rfullscreen,
  html.audio-background #mixpanel,
  html.audio-background #trackpanel,
  html.audio-background #gamepick,
  /* the playbar hides with the rest of the chrome when the tab is a background
     audio source -- but NOT while the editor is open, which also parks the
     frame loop into that mode and would otherwise leave the bar it is
     contained above as an empty strip */
  html.audio-background body:not(.create-open) #playbar{
    visibility:hidden !important;
  }

  /* CRT overlays */
  /* the gain layer is a CANVAS -- a replaced element, so with height:auto its
     intrinsic buffer size wins and the bottom inset is simply ignored. It needs
     a stated height to stop above the player bar. */
  .crt{ position:fixed; inset:0 0 var(--barh,0px) 0; pointer-events:none; z-index:5;
    width:100vw; height:calc(100vh - var(--barh,0px)); }
  /* CRT strength x5 (owner 2026-08-22). The opacity multipliers alone could not
     deliver it -- both were already near their ceiling and clamp at 1 -- so the
     source alphas carry most of the increase: the scanline band and the RGB
     aperture mask here, the falloff and inset shadow below, and the vignette
     factor in the baked gain compositor. ?scanlines=0..1 still overrides. */
  .scanlines{
    background:
      repeating-linear-gradient( to bottom,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.62) 2px, rgba(0,0,0,0.62) 4px),
      repeating-linear-gradient( to right,
        rgba(255,0,0,0.16) 0px, rgba(0,255,0,0.13) 1px, rgba(0,0,255,0.16) 2px);
    mix-blend-mode:multiply; opacity:.3;   /* owner 2026-07-16: CRT effect halved (was .6) */
  }
  .vignette{
    /* A CIRCLE, and gently. An `ellipse at center` fits the box, so on a wide
       window the falloff ran out horizontally long before it ran out
       vertically and the vignette landed as a dark vertical band down each
       side -- measured at 51% of centre brightness. Scaled to match VIG_BG in
       runtime.js, which bakes the layer the CRT actually uses; this rule is
       the legacy fallback and the two must not drift apart. */
    /* IDENTICAL to VIG_BG in runtime.js, character for character. buildGain
       rasterises that string to make the gain map; this rule is the same layer
       drawn live for the legacy path. When they were scaled by separate
       guesses the two paths stopped matching, which is what crt-diff exists to
       catch -- and could not, while it was comparing blank frames. */
    background:radial-gradient(circle farthest-corner at center, rgba(0,0,0,0) 82%, rgba(0,0,0,.09) 100%);
    box-shadow: inset 0 0 60px 0px rgba(0,0,0,.05);
    opacity:1;   /* was .5 (halved 2026-07-16); x5 pass restores it to full */
  }

  /* HUD */
  #hud{
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    display:flex; gap:12px; align-items:center; justify-content:space-between;
    padding:9px 12px; pointer-events:none;
    opacity:0; transition:opacity .6s ease;
  }
  #hud.show{ opacity:.95; }
  #trackname{ font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#bdb0e8;
    text-shadow:0 0 6px rgba(120,100,200,.5); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #trackname b{ color:var(--accent2); font-weight:700; }
  #trackname .sub{ color:#6f679a; }
  #transport{ display:flex; gap:6px; pointer-events:auto; flex:0 0 auto; }
  .btn{
    pointer-events:auto; cursor:pointer;
    background:rgba(20,16,40,.7); color:var(--ink);
    border:2px solid #3a2f66; padding:8px 14px;
    font:inherit; font-size:17px; letter-spacing:1px; text-transform:uppercase;
    box-shadow:0 0 0 2px #0a0814, 3px 3px 0 #2a2150;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn svg{ width:18px; height:18px; }
  .btn:hover{ border-color:var(--accent); color:var(--accent); }
  .btn.on{ border-color:var(--accent2); color:var(--accent2); }

  /* Preset selector (top bar) */
  #presets{
    position:fixed; top:0; left:0; right:0; z-index:6;
    display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap;
    padding:10px; pointer-events:none;
    opacity:0; transition:opacity .6s ease;
  }
  #presets.show{ opacity:1; }
  /* THE MOODS, ON THE STATION. The same words the editor offers, doing the same
     thing: write me one of these and put it on. They fade with the rest of the
     chrome over the game, because idle means gone here. */
  #rmoods{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; justify-content:center;
    margin-top:74px; }   /* clear of the rail's opening paragraph, which is 61px tall at y18 */
  #rmoods .rmood-lab{ pointer-events:none; color:var(--ink-2);
    font:600 12.5px/1 var(--ui); letter-spacing:-.01em; margin-right:2px; }
  #presets .rbtn.rmood{ text-transform:none; letter-spacing:0; font:600 12.5px/1 var(--ui);
    padding:7px 12px; border-radius:999px; }
  #presets .rbtn.rmood.busy{ opacity:.55; }
  body.ai-visual #presets{ opacity:0; pointer-events:none; transition:opacity var(--fade-out); }
  body.ai-visual.controls-active #presets{ opacity:1; transition:opacity var(--fade-in); }
  body.ai-visual.controls-active #presets .rbtn{ pointer-events:auto; }
  @media (max-width:820px){ #rmoods .rmood-lab{ display:none; } }
  /* WAITING TO BE ASKED. Nothing plays on a cold load, so the moods are not
     chrome at that moment -- they are the only thing to do, and they sit in the
     middle of the screen and do not fade. Once a song is on they shrink back to
     the top strip and behave like everything else. */
  /* ===== THE HOME DOES NOT FADE ====================================
     Idle-hide is for watching the game: everything goes so only the picture is
     left. On the home there is no picture yet -- it is a landing page, and a
     landing page whose offers disappear three seconds after you arrive is a
     landing page you cannot read. Everything stays until something is playing.
  */
  body.awaiting-mood #plinks,
  body.awaiting-mood #madeby,
  body.awaiting-mood #dlcard{ opacity:1 !important; transition:none !important; }
  body.awaiting-mood #plinks .plink,
  body.awaiting-mood #madeby .plink,
  body.awaiting-mood #dlcard{ pointer-events:auto !important; }

  /* ===== THE HOME'S BAR IS A TRANSPORT, NOTHING ELSE ================
     Now playing (nothing is), the elapsed and total of a track that does not
     exist, the tempo and volume of silence, and a screen control for a picture
     that has not started. All of them are readings of a song, and on the home
     there is no song -- so the bar keeps the one control that means something
     here, which is the button that starts one. */
  /* NO BAR UNTIL THERE IS A TRACK. It had been stripped to a bare transport on
     the home -- no now playing, no clock, no tempo, no volume, no strip -- and
     what was left was three buttons and an empty band across the bottom of a
     landing page. A transport with nothing to transport is furniture for its
     own sake; the moods are the entry. --barh goes to 0 with it, so the ask,
     the desktop card and the picture all run to the bottom of the window. */
  html body.awaiting-mood #playbar,
  html body.awaiting-mood #playbar.show{ display:none !important; }
  /* Nor a full-screen button (there is nothing yet worth filling a screen with)
     nor the desktop card (an upsell before the thing has even been heard). */
  html body.awaiting-mood #rfullscreen,
  html body.awaiting-mood #dlcard{ display:none !important; }

  /* the bar is always there now, so the hero centres in what is left above it */
  /* A SCRIM, because the backdrop is now a game rather than a black screen.
     Name, line and pills sit over moving pixel art; without something behind
     them the type competes with a platform every two seconds. Radial and
     centred on the hero, so the artwork stays visible at the edges where
     nothing is being read. */
  /* This used to be a full-screen radial gradient, and a soft dark ellipse
     floating over pixel art is a smudge -- worst on the Game Boy face, where a
     grey-green oval sits in the middle of a grey-green screen looking like a
     rendering fault. A CARD has an edge, and an edge is what makes something
     read as deliberate. See #rmoods below. */
  body.awaiting-mood #presets{ top:0; bottom:0; align-items:center;
    padding-bottom:calc(var(--ribh,44px) + 96px);
    opacity:1 !important; transition:opacity .35s ease; }
  body.awaiting-mood #presets .rbtn{ pointer-events:auto; }
  /* THE HERO IS A SCREEN IN A BEZEL.
     A DMG's screen is not flush with the shell: it sits in a black surround,
     inset, with the shell's warm grey around it and a run of thin coloured
     pinstripes along the bottom. That is the whole card -- dark inset panel,
     light shell ring, pinstripes, and the power lamp in the corner. It reads as
     hardware without borrowing a logo or a screen-print from one. */
  /* ONE BEZEL, USED EVERYWHERE. Written as a class so the hero, the download
     card and the how-it-works panel are the same object rather than three
     things that resemble each other until somebody edits one of them. */
  /* THE CARD IS THE CONSOLE, NESTED THE WAY THE HARDWARE IS:
       shell  ->  black bezel  ->  green screen
     It had the middle layer doing the outer job -- the whole card was the black
     bezel, so there was no body, and the buttons sat on the surround instead of
     on the machine. The card is the SHELL now: warm grey plastic, the bevel a
     moulded case has, and the one oversized corner on the BOTTOM RIGHT, which
     is the corner a DMG actually rounds. */
  .gb-bezel{
    position:relative;
    border-radius:16px 16px 46px 16px;
    background:
      linear-gradient(158deg, #e2ded0 0%, #cbc7b8 34%, #bcb8a8 66%, #a8a494 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.8),
      inset 2px 0 0 rgba(255,255,255,.35),
      inset -2px 0 0 rgba(90,86,70,.22),
      inset 0 -3px 7px rgba(90,86,70,.4),
      0 0 0 1px rgba(58,56,44,.55),
      0 22px 52px rgba(0,0,0,.55); }
  /* the speaker grille, bottom right, where the DMG's is -- six slots on the
     same diagonal as the real one */
  .gb-bezel > .gb-speaker{
    position:absolute; right:26px; bottom:16px; width:74px; height:36px;
    pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(58deg,
      rgba(90,86,70,.55) 0 2px, transparent 2px 9px);
    -webkit-mask-image:linear-gradient(58deg, transparent 0 6%, #000 22% 78%, transparent 94% 100%);
    mask-image:linear-gradient(58deg, transparent 0 6%, #000 22% 78%, transparent 94% 100%); }
  /* the pinstripes belong just under the screen, on the shell, not at the very
     bottom of the case */
  .gb-bezel > .gb-stripe{
    position:static; margin:11px 2px 0; height:5px; width:auto;
    border-radius:2px; pointer-events:none;
    background:linear-gradient(180deg,
      var(--gb-button) 0 2px, transparent 2px 3px, #2f3f7a 3px 5px); opacity:.75; }
  /* the pinstripes that run under the screen on the shell */
  .gb-bezel > .gb-stripe{
    position:absolute; left:22px; right:22px; bottom:12px; height:5px;
    border-radius:2px; pointer-events:none;
    background:linear-gradient(180deg,
      var(--gb-button) 0 2px, transparent 2px 3px, #2f3f7a 3px 5px); opacity:.62; }
  body.awaiting-mood #rmoods{
    margin-top:0; flex-direction:column; gap:16px;
    max-width:min(880px,90vw); padding:34px 38px 40px; }
  /* ...AND THE BEZEL IS ONLY THE HERO'S. #rmoods keeps the class in both
     states, so it has to be switched OFF while a track is playing -- not just
     for looks. backdrop-filter makes an element a CONTAINING BLOCK for
     position:fixed descendants, exactly as transform and filter do. The mood
     pills are fixed to the bottom-left corner of the viewport while playing;
     with the bezel live they anchored to #rmoods instead, which is a
     zero-height strip in that state, and the whole row disappeared off the
     page. Clearing the filter is the part that matters; the rest is tidiness. */
  body:not(.awaiting-mood) #rmoods.gb-bezel{
    background:none; box-shadow:none; border-radius:0;
    backdrop-filter:none; -webkit-backdrop-filter:none; }
  body:not(.awaiting-mood) #rmoods.gb-bezel::before,
  body:not(.awaiting-mood) #rmoods.gb-bezel::after{ display:none; }
  /* the pinstripes: on the hardware they run under the screen in maroon and
     navy. Two lines, low contrast, doing the job a signature does. */
  body.awaiting-mood #rmoods::after{
    content:''; position:absolute; left:38px; right:38px; bottom:16px; height:5px;
    border-radius:2px; pointer-events:none;
    background:linear-gradient(180deg,
      var(--gb-button) 0 2px, transparent 2px 3px, #2f3f7a 3px 5px); opacity:.62; }
  /* THE POWER LAMP -- ON THE LEFT EDGE, NOT THE TOP CORNER. A small red dot in
     the top-left of a rounded dark panel is a macOS close button, and it read as
     one. On the hardware the lamp is not up there either: it sits down the LEFT
     SIDE of the screen, level with the middle, in a recessed housing. Moving it
     there kills the association and is the more accurate detail. Bigger, with
     the housing ring around it, so it reads as a lamp rather than a speck. */
  /* NO LAMP. It read as a macOS close button in the corner, and straddling the
     left edge to escape that just made it look like a mistake instead. On the
     hardware the lamp is on the SHELL, outside the black bezel -- and this card
     is the bezel, so there is nowhere on it the lamp honestly belongs. The
     corner, the pinstripes and the shell ring already say what it is. */
  @media (max-width:820px){
    body.awaiting-mood #rmoods{ padding:24px 18px 32px; }
    body.awaiting-mood #rmoods.gb-bezel{ border-radius:12px 12px 12px 26px; }
    body.awaiting-mood #rmoods::after{ left:18px; right:18px; }
  }
  body.awaiting-mood #rmoods .rmood-lab{ display:block; margin:0;
    font:700 clamp(20px,3.2vw,30px)/1.2 var(--ui); color:var(--ink); text-align:center;
    text-shadow:0 2px 18px rgba(0,0,0,.7); }
  body.awaiting-mood #rmoods .rmood-pills{ display:flex; flex-wrap:wrap; gap:9px; justify-content:center; }
  body.awaiting-mood #presets .rbtn.rmood{ font-size:14.5px; padding:9px 16px; }
  /* the brand only exists in the waiting state: it IS the landing page then,
     and the moment something plays the left rail carries the name again */
  #rmoods .rmood-brand{ display:none; }
  body.awaiting-mood #rmoods .rmood-brand{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    margin-bottom:18px; max-width:min(680px,88vw); }
  body.awaiting-mood #rmoods .rmood-brand b{
    font:800 clamp(34px,5.4vw,56px)/1.04 var(--ui); letter-spacing:-.028em; color:#fff;
    text-shadow:0 3px 30px rgba(0,0,0,.55); }
  body.awaiting-mood #rmoods .rmood-brand i{
    font-style:normal; text-align:center; color:var(--ink-2);
    font:500 clamp(14px,1.6vw,18px)/1.5 var(--ui); letter-spacing:-.008em;
    text-shadow:0 2px 16px rgba(0,0,0,.6); }
  body.awaiting-mood #rmoods .rmood-lab{
    font:600 clamp(15px,1.7vw,19px)/1.3 var(--ui); color:var(--ink-2); }
  /* the old entry: a play button in the middle of the page, and a paragraph
     under it explaining what pressing it would do. The moods are the entry now,
     and two calls to action in the same square of screen is one too many. */
  body.awaiting-mood #bigplay{ display:none !important; }
  /* ...and the rail stops repeating the title while the hero is showing it */
  body.awaiting-mood #plinks .plhead b,
  body.awaiting-mood #plinks .plhead > span{ display:none; }
  /* NOTHING YOU CAN DO WITH A TRACK, UNTIL THERE IS A TRACK. Download the ROM,
     the WAV, try it on a Game Boy, listen on a radio -- every one of those acts
     on the song that is playing, and on the home there is not one yet. How it
     works stays: that is a question about the page, which is exactly what
     somebody arriving has. */
  body.awaiting-mood #plinks .plrow{ display:none !important; }
  /* ONCE MUSIC IS PLAYING THE MASTHEAD GOES. Its job is to say what this page
     is, which is a question only an arriving visitor has; with a song on it is
     a panel of prose sitting over the game. The How-it-works button stays --
     it is a rail control like the five under it now -- so the panel simply
     collapses to that one pill. */
  body:not(.awaiting-mood) #plinks .plhead{
    display:block; padding:0; margin-bottom:0; border:0; background:none;
    box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
  body:not(.awaiting-mood) #plinks .plhead b,
  body:not(.awaiting-mood) #plinks .plhead > span{ display:none; }
  body:not(.awaiting-mood) #plinks .plhead .plhow{ margin-left:0; }
  #rmoods .rmood-pills{ display:contents; }
  #rmoods .rmood-ask{ display:contents; }
  /* The ask is the hero's last line again. It had been moved to the corner to
     make room for the credit in the middle; with the player bar gone from the
     landing page there is room for the question to be where the answer is. */
  /* ONE SENTENCE, ONE LINE. "Write me a song that is" and the moods are not a
     heading over a list -- they are the front and the back of the same phrase,
     so they sit on one row, set identically, and wrap together as running text
     rather than breaking between the question and its answers. `display:contents`
     on the pill wrapper lets the individual pills wrap alongside the words
     instead of moving as one block. */
  body.awaiting-mood #rmoods .rmood-ask{
    display:flex; flex-direction:row; flex-wrap:wrap; align-items:center;
    justify-content:center; gap:9px; max-width:min(920px,92vw); }
  /* PLAYING: the moods move out of the top strip and into the bottom-left
     corner of the picture, above the player bar, where the credit used to be. */
  /* The 460px reservation was for the desktop card when it sat bottom-right.
     The card moved to the TOP right, so the bottom strip has the window to
     itself -- and holding the old reservation was wrapping Start from scratch
     onto a second row for no reason. */
  body:not(.awaiting-mood) #rmoods .rmood-ask{
    position:fixed; left:18px; bottom:calc(var(--barh,0px) + 18px); z-index:23;
    display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; gap:7px;
    max-width:calc(100vw - 36px); }
  /* ...and START only takes a row of its own inside the case, where the machine
     puts it. Down here it is one of the row. */
  body:not(.awaiting-mood) #presets .rbtn.rmood-scratch{
    order:0; flex-basis:auto; margin:0; max-width:none; }
  body:not(.awaiting-mood) #rmoods .rmood-ask .rmood-lab{
    display:block; font:600 12.5px/1 var(--ui); color:var(--ink); letter-spacing:-.01em;
    margin-right:2px; text-shadow:0 1px 8px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.7); }
  body:not(.awaiting-mood) #rmoods .rmood-ask .rmood-pills{ display:contents; }
  /* the top strip is empty now, so it must not sit over the picture */
  body:not(.awaiting-mood) #presets{ pointer-events:none; height:0; padding:0; }
  body:not(.awaiting-mood) #rmoods{ margin-top:0; }
  body.awaiting-mood #rmoods .rmood-ask .rmood-lab{
    font:600 14.5px/1 var(--ui); letter-spacing:0; color:var(--ink); margin:0;
    text-shadow:0 1px 10px rgba(0,0,0,.8); }
  body.awaiting-mood #rmoods .rmood-ask .rmood-pills{ display:contents; }
  /* THE CREDIT TAKES THE TOP CENTRE on the home. It was briefly made static so
     it could sit inside the hero, which is a centred column of unknown height --
     but static on a body-level element means normal document flow, and when the
     node had not been moved into the hero yet it flowed to the top-left of the
     page at full width. Fixed and centred needs no DOM move and cannot race. */
  /* THE CREDIT IS AT THE TOP, in both states: on the landing page and on the
     screen that plays. It swapped with the moods -- they were at the top while
     it sat in the corner, and it is the other way round now. */
  /* PLAYING: the credit takes the top, swapped with the moods.
     LANDING: it takes the bottom-left corner -- the middle belongs to the name
     and the question, and there is no bar down there to avoid. */
  /* Centred in the VIEWPORT, it ran under the desktop card in the top-right and
     Hacker News vanished behind it. Centred in what is left beside the card
     instead, which stays right however wide the window gets. */
  /* 442, not 392: the card went from 352 to 390 wide when the type grew, and
     the reservation did not follow it -- 16px of overlap, measured. */
  body:not(.awaiting-mood) #madeby{ top:18px; bottom:auto; left:250px; right:442px;
    transform:none; justify-content:center; flex-wrap:wrap; row-gap:8px; max-width:none; }
  /* 232px clears the rail's How-it-works pill, 392px clears the desktop card.
     What is left is 876px at 1500 wide and the row wanted 1070, so on the
     PLAYING screen -- where the credit is secondary to the picture -- it is set
     a notch smaller. The landing page keeps the full size; it has the room. */
  /* NOT SHRUNK. This was set two steps below everything else purely so the row
     would fit beside the desktop card -- solving a layout problem by making
     text smaller, which is the thing being complained about. It is the same
     size as the landing page now and wraps to a second line inside its reserved
     band when it must, which is what the band is for. */
  body:not(.awaiting-mood) #madeby .plmade-t{ font-size:var(--txt) !important; }
  body:not(.awaiting-mood) #madeby .plink{ font-size:var(--txt) !important;
    min-height:52px; padding:13px 21px !important; }
  body:not(.awaiting-mood) #madeby .plink svg{ width:19px; height:19px; }
  @media (max-width:1100px){
    body:not(.awaiting-mood) #madeby{ right:0; flex-wrap:wrap; } }
  body.awaiting-mood #madeby{ top:auto; bottom:18px; left:18px; transform:none;
    justify-content:flex-start; max-width:calc(100vw - 36px); opacity:1 !important; }
  @media (max-width:1100px){
    body.awaiting-mood #madeby{ position:fixed; top:auto;
      bottom:calc(var(--barh,0px) + 96px); max-width:calc(100vw - 36px); flex-wrap:wrap; } }
  #presets .rbtn.rmood-scratch{ border-color:rgba(123,220,160,.45); color:#bfe9cf; }

  #gbscreen .gb-slots{ display:flex; flex-direction:column; gap:4px; width:44px; margin:16px 6px 0 auto;

  #gbscreen .gb-side p{ margin:0 0 18px; color:#b6afd0; font-size:14.5px; line-height:1.55; }
  #gbscreen .gb-side code{ background:rgba(255,255,255,.08); padding:1px 5px; border-radius:4px; font-size:13px; }
  #gbscreen .gb-actions{ display:flex; flex-wrap:wrap; gap:10px; }
  #gbscreen .gb-btn{ height:44px; padding:0 18px; border-radius:999px; cursor:pointer;

  body.gb-open #plinks, body.gb-open #playbar{ display:none !important; }
  @media (max-width:820px){ #gbscreen{ align-content:center; overflow:auto; } #gbscreen .gb-side{ flex-basis:100%; } }

  /* THE RAIL: everything you can do with the track that is playing, down the
     left edge. Vertically centred rather than pinned to a corner, because the
     top centre now carries the track name and the bottom carries the transport,
     and a column that grows from the middle stays clear of both. */
  #plinks{ position:fixed; left:18px; top:18px; z-index:24;
    display:none; flex-direction:column; align-items:flex-start; gap:8px;
    max-height:calc(100vh - 36px); }
  #plinks .plrow{ display:flex; align-items:center; gap:6px; }
  /* who made it, under the masthead and above the offers */
  /* it sits directly on the game, with nothing behind it -- the same shadow the
     rest of the free-standing chrome uses, or a bright frame swallows it */
  /* THE CREDIT SITS IN THE BOTTOM-LEFT CORNER OF THE PICTURE, on its own line
     with its three pills to the right of it -- out of the rail, which is for
     things you do with the track. Above the player bar, like everything else
     that belongs to the game. */
  #madeby{ position:fixed; z-index:22;
    display:none; align-items:center; gap:10px; flex-wrap:wrap;
    pointer-events:none; }
  body.ai-visual #madeby{ display:flex; opacity:0; pointer-events:none; transition:opacity var(--fade-out); }
  body.ai-visual.controls-active #madeby{ opacity:1; transition:opacity var(--fade-in); }
  body.ai-visual.controls-active #madeby .plink{ pointer-events:auto; }
  /* the same type as the labels it sits with: .plink-t is 600 13.5px */
  /* 17px, and stated as font-size rather than buried in a `font:` shorthand.
     The shorthand set 13.5px here and this selector carries an id, so it beat
     the .plmade-t rule that raised everything else -- the credit stayed small on
     the landing page while every neighbour grew. */
  #madeby .plmade-t{ color:var(--ink); font:600 var(--txt)/1 var(--ui); letter-spacing:.005em;
    white-space:nowrap; text-shadow:0 1px 8px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.7); }
  #madeby .plmade-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #madeby .plmade-btn{ text-decoration:none; }
  #madeby .plmade-btn svg{ width:18px; height:18px; display:block; }
  body.gb-open #madeby, body.create-open #madeby,
  html.wallpaper-mode #madeby, html.popover-mode #madeby,
  html.browse-mode #madeby{ display:none !important; }
  /* It used to be hidden here, from when it sat under the masthead and would
     have run into the hero. It lives at the foot of the rail now, and the
     landing page is exactly where a credit belongs. */
  /* What the page is, above the first thing it offers you. ONE flowing
     paragraph: the name starts the sentence and the description continues from
     it, rather than sitting as a heading with a caption broken underneath. */
  /* This was the one piece of chrome with NO surface -- bare text drawn straight
     over whatever the game is showing. Over the Game Boy screen, which is cream,
     light text on light ground is not text. It gets the same material as
     everything else, with a softer radius than the pills so it reads as a label
     rather than something you can press. Hierarchy comes from WEIGHT, not size:
     two type sizes on one short line is fuss, and weight adds presence without
     taking more room. */
  /* No panel. The masthead used to be a card with the name, the line under it
     and the how-it-works button inside; the name and the line live in the hero
     now, so all the card contained was one pill -- a box around a button that
     is already a box. */
  #plinks .plhead{ align-self:flex-start; white-space:nowrap; margin-bottom:4px;
    padding:0; border:0; background:none; box-shadow:none;
    backdrop-filter:none; -webkit-backdrop-filter:none; }
  /* A title is set as a title: large, tight leading, NEGATIVE tracking, with the
     description under it at body size. At 13.5px sharing a line with its own
     explanation it was a label, not the name of the page. */
  /* Title and description share ONE line, sitting on a common baseline. Two
     sizes on a line need baseline alignment, not centre: aligned to their boxes
     the 15px text floats inside the 26px line and reads as a mistake. */
  #plinks .plhead{ display:flex; align-items:baseline; gap:11px; }
  #plinks .plhead b{ flex:0 0 auto; font:700 26px/1.15 var(--ui); letter-spacing:-.022em;
    color:var(--ink); }
  /* DIRECT CHILD. As `.plhead span` this also matched the spans inside the
     how-it-works button -- its label came out 15px/400 against every other rail
     label at 13.5px/600, which is why the one button in the masthead read as a
     different kind of control however much the pill around it matched. */
  #plinks .plhead > span{ flex:0 1 auto; font:400 15px/1.15 var(--ui);
    letter-spacing:0; color:var(--ink-2); }
  /* the how-it-works pill rides the masthead line, compact against 26px type */
  /* the same pill as every other offer in the rail: it was 32px with a smaller
     label, which made the one button in the masthead read as a different
     family of control from the five under it */
  #plinks .plhead .plhow{ flex:0 0 auto; align-self:center; margin-left:14px; }
  .plink{ height:46px; padding:0 18px; border-radius:999px; border:1px solid var(--mat-edge);
    background:var(--mat); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:9px;
    box-shadow:var(--mat-shadow); backdrop-filter:var(--mat-blur); -webkit-backdrop-filter:var(--mat-blur);
    transition:opacity .22s ease, border-color .12s, color .12s, background .12s; }
  .plink:hover{ border-color:var(--mat-edge-hi); color:#fff; background:var(--mat-hi); }
  /* Game Boy screen: an on/off control, so it has to look on. The DMG palette's
     own lightest shade, which is also what the panel it turns on is made of. */
  .plink.on{ background:rgba(155,188,15,.16); border-color:rgba(155,188,15,.55); color:#dbe89a; }
  .plink.on:hover{ background:rgba(155,188,15,.24); border-color:rgba(155,188,15,.75); color:#eef5c8; }
  .plink .plink-ic{ display:inline-flex; flex:0 0 auto; }
  /* live right now, said where the stream actually is */
  .plink .plink-dot{ width:8px; height:8px; flex:0 0 auto; margin-right:-1px; border-radius:50%;
    background:#ff5d5d; box-shadow:0 0 8px #ff5d5d; animation:live-pulse 1.4s ease-in-out infinite; }
  .plink svg{ width:20px; height:20px; flex:0 0 auto; }
  .plink-t{ font:600 13.5px/1 var(--ui); letter-spacing:.005em; white-space:nowrap; }
  @media (max-height:640px){ #plinks .plhead{ display:none; } }
  /* One line means one line: below this the sentence runs off the right edge,
     and the name on its own still says what the page is. */
  @media (max-width:980px){ #plinks .plhead > span{ display:none; } }
  /* FIRST LOAD. Big, centred, and the only thing asking to be pressed. Feedback
     lands on the press rather than the release, and it materialises -- blur and
     scale together -- so it arrives as a surface rather than fading in. */
  #bigplay{ position:fixed; left:50%; top:50%; z-index:32;
    width:132px; height:132px; padding:0; border-radius:50%; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--mat); border:1px solid var(--mat-edge); color:var(--ink);
    box-shadow:var(--mat-shadow);
    backdrop-filter:var(--mat-blur); -webkit-backdrop-filter:var(--mat-blur);
    opacity:0; pointer-events:none; transform:translate(-50%,-50%) scale(.92);
    transition:opacity .3s ease, transform .3s cubic-bezier(.2,.8,.3,1),
               background .12s ease, border-color .12s ease; }
  #bigplay.show{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  #bigplay:hover{ background:var(--mat-hi); border-color:var(--mat-edge-hi); }
  #bigplay.press{ transform:translate(-50%,-50%) scale(.965); transition:transform .1s ease-out; }
  #bigplay svg{ width:54px; height:54px; margin-left:6px; }   /* optical centre of a triangle */
  /* the one sentence that says what this page IS, attached to the one control
     a first visit offers */
  #bigplay .bp-cap{ position:absolute; top:calc(100% + 18px); left:50%; transform:translateX(-50%);
    width:max-content; max-width:min(76vw,560px); white-space:normal; text-align:center;
    padding:10px 16px; border-radius:13px;
    background:var(--mat); border:1px solid var(--mat-edge); box-shadow:var(--mat-shadow);
    backdrop-filter:var(--mat-blur); -webkit-backdrop-filter:var(--mat-blur);
    font:500 14px/1.45 var(--ui); letter-spacing:.005em; color:var(--ink-2); }
  body.gb-open #bigplay{ opacity:0 !important; pointer-events:none !important; }
  @media (prefers-reduced-motion: reduce){
    #bigplay, #bigplay.show, #bigplay.press{ transform:translate(-50%,-50%); transition:opacity .2s ease; }
    :root{ --fade-out:.25s ease; --fade-in:.12s ease-out; }
  }

  /* CREATE: the Mario-Paint-spirit editor. A full-screen takeover; the grid

  #createscreen{ position:fixed; inset:0 0 var(--barh,0px) 0; z-index:76; display:flex; flex-direction:column;

  body.ai-visual #plinks{ display:flex; opacity:0; pointer-events:none; transition:opacity var(--fade-out); }
  /* The COLUMN never takes the pointer, only its rows do. A one-line masthead
     makes the column as wide as the sentence -- 762px -- and an interactive box
     that size sitting over the game is a dead zone you cannot see. */
  body.ai-visual.controls-active #plinks{ opacity:1; pointer-events:none; transition:opacity var(--fade-in); }
  body.ai-visual.controls-active #plinks .plrow,
  body.ai-visual.controls-active #plinks .plhead .plhow{ pointer-events:auto; }

  /* THE DESKTOP CARD: the one offer on this screen that is not about the track
     you are hearing, so it does not sit in the rail with the ones that are. It
     stacks above the track name in the bottom-left corner -- the pill is 46px
     at bottom:18px, so this clears it at 76. */
  /* Same width, same corner, same padding as the track box it stacks on: two
     surfaces in one corner that do not agree read as two accidents. */
  /* the card belongs to the picture, so it sits inside it: clear of the player
     bar, which owns the bottom of the window on its own */
  /* the same bezel as the hero -- .gb-bezel carries the shell ring, the corner
     and the material; this only places it and sizes it */
  #dlcard{ position:fixed; right:26px; left:auto; bottom:calc(var(--barh,0px) + 26px); z-index:22; display:none;
    width:390px; max-width:calc(50vw - 234px); padding:16px 18px 26px; }
  #dlcard .dlc-h{ font:700 14.5px/1.25 var(--ui); letter-spacing:-.005em; color:var(--ink); }
  #dlcard .dlc-d{ margin-top:5px; font:500 13.5px/1.45 var(--ui); letter-spacing:.005em; color:var(--ink-2); }
  /* THE LITTLE DESKTOP. A screen with a menu bar, two file icons and a dock,
     and the running game behind all of it -- which is exactly what the app
     does. The chrome is drawn in CSS so it costs nothing and stays crisp at
     any DPR; only the wallpaper is a canvas. */
  #dlcard .dlc-shot{ position:relative; margin-top:11px; border-radius:9px; overflow:hidden;
    aspect-ratio:296/166; background:#05040c;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 8px 22px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.04); }
  #dlcard .dlc-shot picture{ display:block; width:100%; height:100%; }
  #dlcard .dlc-wall{ display:block; width:100%; height:100%; object-fit:cover;
    background:#05040c; }
  /* THE MENU BAR. Translucent, a rounded logo mark, a bold app name, three
     menu titles, then status glyphs and a clock on the right -- the shape the
     eye recognises before it reads anything. */
  #dlcard .dlc-menu{ position:absolute; left:0; right:0; top:0; height:13px;
    display:flex; align-items:center; gap:5px; padding:0 5px;
    background:rgba(238,238,242,.16); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(255,255,255,.10); }
  #dlcard .dlm-logo{ width:7px; height:8px; border-radius:2px 2px 3px 3px;
    background:rgba(255,255,255,.92); flex:0 0 auto; }
  #dlcard .dlm-app{ font:700 6px/1 var(--px); color:rgba(255,255,255,.95); letter-spacing:.02em; }
  #dlcard .dlm-i{ font:400 6px/1 var(--px); color:rgba(255,255,255,.62); }
  #dlcard .dlm-sp{ flex:1 1 auto; }
  #dlcard .dlm-s{ width:6px; height:6px; border-radius:1px; background:rgba(255,255,255,.5); }
  #dlcard .dlm-clock{ width:22px; height:5px; border-radius:2px; background:rgba(255,255,255,.62); }

  /* AN OPEN WINDOW, because "wallpaper" means BEHIND something. With nothing
     over it the picture was just a screenshot of the game full-screen, which
     is the one reading the card must not give. */
  #dlcard .dlc-win{ position:absolute; left:11%; top:26%; width:52%; height:50%;
    border-radius:5px; overflow:hidden; background:rgba(30,28,38,.92);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 8px 20px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.10) inset; }
  #dlcard .dlw-bar{ height:11px; display:flex; align-items:center; gap:3px; padding:0 4px;
    background:rgba(58,55,70,.95); border-bottom:1px solid rgba(0,0,0,.35); }
  #dlcard .dlw-bar i{ width:4px; height:4px; border-radius:50%; flex:0 0 auto; }
  #dlcard .dlw-bar i.r{ background:#ff5f57; } #dlcard .dlw-bar i.y{ background:#febc2e; }
  #dlcard .dlw-bar i.g{ background:#28c840; }
  #dlcard .dlw-bar b{ margin-left:4px; width:34px; height:3px; border-radius:2px;
    background:rgba(255,255,255,.34); }
  #dlcard .dlw-body{ padding:7px 7px 0; display:flex; flex-direction:column; gap:5px; }
  #dlcard .dlw-body u{ display:block; height:3px; border-radius:2px; text-decoration:none;
    background:rgba(255,255,255,.20); }

  /* THE DOCK. Distinguishable apps, not five identical squares: different hues,
     one with the running dot under it. */
  #dlcard .dlc-dock{ position:absolute; left:50%; transform:translateX(-50%); bottom:4px;
    display:flex; align-items:flex-end; gap:3px; padding:3px 4px; border-radius:7px;
    background:rgba(236,236,242,.18); border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); }
  #dlcard .dlc-dock s{ width:12px; height:12px; border-radius:3px; text-decoration:none;
    box-shadow:0 1px 2px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.28); }
  #dlcard .dlc-dock s.d1{ background:linear-gradient(180deg,#5aa9ff,#2f6fd0); }
  #dlcard .dlc-dock s.d2{ background:linear-gradient(180deg,#7be08f,#2f9c52); }
  #dlcard .dlc-dock s.d3{ background:linear-gradient(180deg,#ffd35a,#e0a020); }
  #dlcard .dlc-dock s.d4{ background:linear-gradient(180deg,#ff8f7a,#d64a34); }
  /* the station itself, in its own burgundy, with the running dot */
  #dlcard .dlc-dock s.d5{ background:linear-gradient(180deg,var(--gb-button-hi),var(--gb-button));
    position:relative; }
  #dlcard .dlc-dock s.d5::after{ content:''; position:absolute; left:50%; bottom:-3px;
    transform:translateX(-50%); width:2px; height:2px; border-radius:50%;
    background:rgba(255,255,255,.9); }
  #dlcard .dlc-dock s.sep{ width:1px; height:12px; border-radius:0; box-shadow:none;
    background:rgba(255,255,255,.22); }
  #dlcard .dlc-dock s.d6{ background:linear-gradient(180deg,#b9b9c6,#7e7e8c); }
  @media (prefers-reduced-motion:reduce){ #dlcard .dlc-shot{ }  /* the blit is the animation; nothing spins */ }
  #dlcard .dlc-b{ margin-top:11px; display:flex; gap:7px; }
  #dlcard .dlc-b button{ height:38px; padding:0 15px; border-radius:999px; cursor:pointer;
    border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:var(--ink);
    font:600 13.5px/1 var(--ui); letter-spacing:.005em; white-space:nowrap;
    transition:border-color .12s, color .12s, background .12s; }
  #dlcard .dlc-b button:hover{ border-color:var(--mat-edge-hi); color:#fff; background:rgba(255,255,255,.11); }
  /* the OS you are on leads, and looks like the answer */
  #dlcard .dlc-b button:first-child{ background:rgba(143,122,224,.22); border-color:rgba(143,122,224,.55); color:#e6e0ff; }
  #dlcard .dlc-b button:first-child:hover{ background:rgba(143,122,224,.32); border-color:rgba(143,122,224,.75); color:#fff; }
  body.ai-visual #dlcard{ display:block; opacity:0; pointer-events:none; transition:opacity var(--fade-out); }
  body.ai-visual.controls-active #dlcard{ opacity:1; pointer-events:auto; transition:opacity var(--fade-in); }
  body.gb-open #dlcard{ display:none !important; }

  /* MOBILE NAV MENU — the hamburger's standard link menu (a column of big rows). Backdrop click closes. */
  #navmenu{ position:fixed; inset:0; z-index:60; display:none; padding:74px 16px 20px; justify-content:center; align-items:flex-start;
    background:rgba(6,4,14,.62); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
  #navmenu.show{ display:flex; animation:navmenu-in .18s ease; }
  @keyframes navmenu-in{ from{ opacity:0; } to{ opacity:1; } }
  .navmenu-panel{ width:min(420px,92vw); background:rgba(20,16,40,.98); border:1px solid var(--mat-edge); border-radius:22px;
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); overflow:hidden; }
  .navmenu-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 12px 12px 20px; }
  .navmenu-title{ font:600 16px/1 var(--ui); letter-spacing:-.01em; color:#f4f1fc; }
  .navmenu-close{ all:unset; cursor:pointer; width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; color:#c9c2e2; font-size:26px; line-height:1; }
  .navmenu-close:active{ background:rgba(255,255,255,.08); }
  .navitem{ all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:15px; width:100%;
    padding:16px 18px; border-top:1px solid rgba(255,255,255,.07); }
  .navitem:active{ background:rgba(255,255,255,.07); }
  .navitem-ic{ flex:0 0 auto; width:26px; height:26px; display:flex; align-items:center; justify-content:center; color:var(--ink); }
  .navitem-ic svg{ width:100%; height:100%; }
  .navitem-txt{ display:flex; flex-direction:column; gap:2px; flex:1 1 auto; min-width:0; }
  .navitem-l{ font:600 16.5px/1.2 var(--ui); letter-spacing:-.012em; color:#f4f1fc; }
  .navitem-s{ font:400 13px/1.3 var(--ui); color:#9c95b8; }
  .navitem-chev{ flex:0 0 auto; color:#6b6488; font-size:24px; line-height:1; }

  /* Visualizer picker opened by the G key. This is testing chrome, not game UI. */
  #gamepick{ position:fixed; inset:0; z-index:10040; display:none; align-items:center; justify-content:center;
    padding:22px; background:rgba(5,4,12,.52); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  #gamepick.show{ display:flex; }
  #gamepick .gp-panel{ width:min(620px,calc(100vw - 28px)); max-height:min(720px,calc(100dvh - 34px)); overflow:hidden;
    background:rgba(10,8,20,.96); border:1px solid rgba(207,199,240,.18); border-radius:14px;
    box-shadow:0 24px 80px rgba(0,0,0,.68),0 0 38px rgba(248,120,248,.12); color:#fff; }
  #gamepick .gp-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:18px; padding:18px 18px 14px;
    border-bottom:1px solid rgba(207,199,240,.12); }
  #gamepick .gp-title{ font:800 18px/1.15 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:0; }
  #gamepick .gp-sub{ margin-top:4px; color:#a99fc9; font:600 12px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:0; }
  #gamepick .gp-close{ flex:0 0 auto; width:34px; height:34px; border:0; border-radius:50%; cursor:pointer;
    background:rgba(255,255,255,.08); color:#e9e4ff; font:700 22px/1 system-ui,-apple-system,sans-serif; }
  #gamepick .gp-close:hover{ background:rgba(255,255,255,.14); color:#fff; }
  #gamepick .gp-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:10px; padding:14px 18px 18px;
    max-height:calc(min(720px,100dvh - 34px) - 82px); overflow:auto; }
  #gamepick .gp-item{ min-height:58px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer;
    border:1px solid rgba(207,199,240,.14); border-radius:10px; background:rgba(255,255,255,.055); color:#f6f2ff;
    padding:11px 12px; text-align:left; font:800 15px/1.15 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #gamepick .gp-item:hover{ border-color:rgba(248,120,248,.56); background:rgba(248,120,248,.11); }
  #gamepick .gp-item.active{ border-color:rgba(88,248,152,.74); background:rgba(88,248,152,.12); color:#fff; }
  #gamepick .gp-key{ display:block; margin-top:3px; color:#8f86b8; font:700 11px/1.2 var(--mono); }
  #gamepick .gp-dot{ width:10px; height:10px; border-radius:50%; background:transparent; border:1px solid rgba(207,199,240,.34); flex:0 0 auto; }
  #gamepick .gp-item.active .gp-dot{ background:var(--accent2); border-color:var(--accent2); box-shadow:0 0 12px rgba(88,248,152,.45); }

  /* Intro */
  #intro{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px; padding:24px;
    background:none; isolation:isolate;
    transition:opacity .5s ease;
  }
  #intro::before{
    /* position:fixed (not absolute) so the scrim stays pinned to the viewport instead of
       scrolling away with the cards when product-home overflows and scrolls. */
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at center,#160f2e 0%,#0a0814 70%);
    opacity:1; transition:opacity .22s ease;
  }
  body.song-visual #intro:not(.lib)::before,
  body.ai-visual #intro:not(.lib)::before{ opacity:.8; }
  #intro > *{ position:relative; z-index:1; }
  #intro .intro-hero{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    max-width:min(760px,92vw); padding:8px 12px 2px;
  }
  #intro h1{
    font-size:clamp(38px,7.5vw,76px); line-height:1; font-weight:700;
    letter-spacing:2px;
    color:var(--ink);
    text-shadow:
      4px 4px 0 #a80020,
      8px 8px 0 #0000fc,
      0 0 24px rgba(248,120,248,.45);
  }
  #intro .sub{ max-width:760px; font:600 clamp(19px,2.4vw,28px)/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#e6e1f7; letter-spacing:-.01em; text-transform:none; }
  #intro .keys{ font-size:12px; color:#6f679a; letter-spacing:1px; max-width:520px; line-height:1.9; }
  #intro .keys b{ color:var(--accent2); }
  /* HOME container — holds the platform cards. (The old per-mood station-tile chooser was
     removed: there is one station now, the shared LIVE broadcast.) */
  #hometiles{ display:block; width:min(1240px,95vw); max-height:74vh; overflow-y:auto; padding:6px; }
  /* ===== HOME PLATFORM CARDS — Apple-clean, over the live game. Every way to get Chiptunes:
     browser · desktop · YouTube · radio. ===== */
  /* Section heading above the grid — Apple product-page voice. */
  .platforms-head{ text-align:center; max-width:660px; margin:0 auto 32px; }
  .platforms-title{ margin:0 0 10px; font:600 clamp(27px,3.4vw,40px)/1.08 var(--ui); letter-spacing:-.024em; color:#f6f4fc; }
  .platforms-sub{ margin:0; font:400 clamp(15px,1.7vw,18px)/1.5 var(--ui); letter-spacing:-.012em; color:#b3accb; }
  /* Four equal cards, 2×2 — each a way to reach the one shared station. */
  .platforms{ width:min(900px,94vw); display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; align-items:stretch; }
  .pcard{ box-sizing:border-box; height:100%; display:flex; flex-direction:column; gap:14px; text-align:left;
    padding:28px 28px 26px; border-radius:24px; background:rgba(18,15,34,.6); border:1px solid rgba(255,255,255,.09);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 20px 50px rgba(0,0,0,.42);
    -webkit-backdrop-filter:blur(28px) saturate(1.3); backdrop-filter:blur(28px) saturate(1.3);
    transition:border-color .22s ease, box-shadow .22s ease, background .22s ease, transform .22s ease; }
  .pcard:hover{ border-color:rgba(255,255,255,.16); background:rgba(22,18,42,.7); transform:translateY(-2px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 28px 66px rgba(0,0,0,.52); }
  .pc-title{ margin:0; font:600 21px/1.2 var(--ui); letter-spacing:-.021em; color:#f6f4fc; display:flex; align-items:center; gap:10px; }
  .pc-desc{ margin:0; font:400 15.5px/1.5 var(--ui); color:#b3accb; letter-spacing:-.012em; }
  .pc-url{ flex:1 1 auto; min-width:0; font:600 13px/1.4 var(--mono); color:#a6ecc0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    background:rgba(94,224,138,.09); border:1px solid rgba(94,224,138,.22); border-radius:11px; padding:0 13px; height:42px; display:flex; align-items:center; }
  /* Radio: the stream URL over a Copy + Listen row, pinned to the card bottom (wraps neatly in the
     narrower three-across column). */
  .pc-radiorow{ display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-top:auto; }
  .pc-radiorow .pc-url{ flex:1 1 100%; }
  .pc-radiorow .pc-copy, .pc-radiorow .pc-btn{ flex:1 1 auto; }
  .pc-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:auto; padding-top:2px; }
  /* One button system — Apple-clean filled accent, identical size + shape across every card */
  .pc-btn{ all:unset; box-sizing:border-box; cursor:pointer; height:44px; min-width:92px; padding:0 20px;
    display:inline-flex; align-items:center; justify-content:center; border-radius:12px;
    font:600 15px/1 var(--ui); letter-spacing:-.01em;
    color:#0c0a16; background:var(--pc); box-shadow:0 2px 10px rgba(0,0,0,.22);
    transition:filter .15s ease, transform .1s ease, box-shadow .15s ease; }
  .pc-btn:hover{ filter:brightness(1.05); box-shadow:0 5px 16px rgba(0,0,0,.3); }
  .pc-btn:active{ transform:scale(.97); }
  .pc-btn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  /* Desktop download buttons — Apple-landing style: platform glyph + name. The visitor's own OS is
     the filled primary (.is-primary), the others are glass secondaries. */
  .pc-btn.pc-dl{ gap:9px; padding:0 18px; color:#ece9f7; background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.14); box-shadow:none; }
  .pc-btn.pc-dl:hover{ filter:none; background:rgba(255,255,255,.11); border-color:var(--mat-edge-hi); box-shadow:0 4px 14px rgba(0,0,0,.24); }
  .pc-btn.pc-dl .pc-dl-ic{ display:inline-flex; width:17px; height:17px; opacity:.92; }
  .pc-btn.pc-dl .pc-dl-ic svg{ width:100%; height:100%; }
  .pc-btn.pc-dl.is-primary{ color:#0c0a16; background:var(--pc); border-color:transparent; box-shadow:0 2px 12px rgba(0,0,0,.26); }
  .pc-btn.pc-dl.is-primary:hover{ filter:brightness(1.05); background:var(--pc); box-shadow:0 6px 18px rgba(0,0,0,.34); }
  .pc-btn.pc-dl.is-primary .pc-dl-ic{ opacity:1; }
  .live-badge{ font:600 10px/1 var(--ui); letter-spacing:.5px; color:#ff6a6a; text-transform:uppercase;
    background:rgba(255,93,93,.13); border:1px solid rgba(255,93,93,.36); border-radius:999px; padding:4px 9px 4px 8px; display:inline-flex; align-items:center; gap:5px; }
  .live-badge::before{ content:""; width:6px; height:6px; border-radius:50%; background:#ff5d5d; box-shadow:0 0 8px #ff5d5d; animation:live-pulse 1.4s ease-in-out infinite; }
  @keyframes live-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
  /* Ambient YouTube live embed — 16:9 box, minimal margin, non-interactive so the "more videos" overlay never shows. */
  .pc-embed{ position:relative; width:100%; margin:2px 0; aspect-ratio:16/9;
    border-radius:14px; overflow:hidden; background:#000; box-shadow:0 12px 34px rgba(0,0,0,.46); }
  .pc-embed iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  .pc-embed-ambient iframe{ pointer-events:none; }   /* always-playing + non-interactive => the pause/hover related-videos grid can't trigger */
  /* Transparent click-catcher over the non-interactive iframe — click opens the channel (subscribe there). */
  .pc-embed-open{ position:absolute; inset:0; z-index:2; display:flex; align-items:flex-end; justify-content:flex-start; cursor:pointer;
    text-decoration:none; opacity:0; transition:opacity .2s ease;
    background:linear-gradient(0deg, rgba(6,4,14,.66) 0%, rgba(6,4,14,0) 42%); }
  .pc-embed-open::after{ content:"Watch on YouTube Live \0000a0 ↗"; margin:14px 16px; font:600 13px/1 var(--ui); letter-spacing:-.01em; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  .pc-embed:hover .pc-embed-open{ opacity:1; }
  @media (max-width:760px){ .pc-embed{ display:none; } }
  /* Radio card: the stream URL with a Copy button beside it, plus a paste hint. */
  .pc-urlrow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pc-urlrow .pc-url{ flex:1 1 200px; margin:0; align-self:auto; }
  .pc-copy{ all:unset; box-sizing:border-box; cursor:pointer; flex:0 0 auto; height:42px; padding:0 15px;
    display:inline-flex; align-items:center; justify-content:center; border-radius:11px;
    font:600 13.5px/1 var(--ui); letter-spacing:-.01em; white-space:nowrap;
    color:#dbd6ee; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); transition:filter .15s ease, transform .1s ease, background .15s ease; }
  .pc-copy:hover{ background:rgba(255,255,255,.12); } .pc-copy:active{ transform:scale(.97); } .pc-copy:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  /* Radio-row action button (Listen) — compact, matches the URL/Copy height. */
  .pc-radiorow .pc-btn{ flex:0 0 auto; height:42px; min-width:0; padding:0 16px; border-radius:11px; font-size:13.5px; }
  .pc-hint{ margin:0; font:400 13.5px/1.5 var(--ui); color:#948dad; letter-spacing:-.008em; }
  #intro.product-home{ justify-content:flex-start; align-items:center; gap:20px; overflow-y:auto; overflow-x:hidden; padding:0 22px 72px; }
  /* Hero owns the top of the viewport so the live game plays in full view before you reach the
     cards — lofi-radio style. The wordmark sits centred in that band; cards start below it. */
  #intro.product-home .intro-hero{ min-height:46vh; justify-content:center; gap:12px; padding:24px 12px 8px; }
  #intro.product-home h1{ font-size:clamp(30px,4.6vw,52px); }
  #intro.product-home .sub{ font-size:clamp(15px,1.8vw,20px); max-width:640px; }
  #intro.product-home #hometiles{ max-height:none; overflow:visible; width:auto; padding:0; }
  /* Reveal the live game brightest through the hero band, then fade to dark behind the cards. */
  #intro.product-home::before{ opacity:1;
    background:linear-gradient(180deg, rgba(10,8,20,.46) 0%, rgba(10,8,20,.30) 30%, rgba(10,8,20,.60) 66%, rgba(10,8,20,.86) 100%); }
  /* ===== MOBILE HOME — Apple-tight: compact cards that fit a phone, a page that actually
     scrolls, and a headline without the heavy 8px shadow ghosting at small sizes. ===== */
  @media (max-width:760px){
    #intro.product-home{ justify-content:flex-start; gap:14px; -webkit-overflow-scrolling:touch; touch-action:pan-y;
      padding:0 14px calc(env(safe-area-inset-bottom,0px) + 40px); }
    #intro.product-home .intro-hero{ min-height:34vh; justify-content:center; gap:8px;
      padding:calc(env(safe-area-inset-top,0px) + 18px) 6px 8px; }
    #intro.product-home h1{ font-size:clamp(26px,8.4vw,34px); letter-spacing:1px;
      text-shadow:2px 2px 0 #a80020, 4px 4px 0 #0000fc; }
    #intro.product-home .sub{ font-size:14.5px; line-height:1.4; max-width:none; }
    .platforms{ width:100%; grid-template-columns:1fr; gap:14px; }   /* one column on phones */
    .platforms-head{ margin-bottom:22px; }
    .pcard{ padding:20px; gap:12px; border-radius:20px; box-shadow:0 14px 34px rgba(0,0,0,.42); }
    .pcard:hover{ transform:none; }
    .pc-title{ font-size:18px; }
    .pc-desc{ font-size:14px; line-height:1.5; }
    .pc-actions{ gap:8px; }

  /* Visual mode: no persistent bottom dock, just optional cover art, title chip, and temporary controls. */
  /* THE TRACK RIBBON: the whole song, laid out end to end, doubling as the
     progress bar. A music player puts a waveform where the scrubber goes; the
     Game Boy's equivalent of a waveform is its notes, so that is what this
     draws -- every note of the track at once, played part lit and the rest
     ahead of you dimmed. Narrow on purpose: it is a strip, not a second view.
     Painted by the frame loop into one canvas, so it costs two drawImages. */
  /* the scrub row: elapsed | the track | total, under the transport buttons */
  #playbar .pb-scrub{ grid-column:1 / -1; grid-row:2; display:none;
    align-items:center; flex-wrap:nowrap; gap:10px; width:min(720px,52vw); min-width:0; }
  body.ribbon-on #playbar .pb-scrub{ display:flex; }
  /* THE PLAYER BAR IS ALWAYS THE PLAYER BAR. It used to appear only once a
     track was on, so the first thing a visitor saw was a page with no
     transport, and the bar arrived under them the moment they picked a mood.
     It is the same bar in the same place from the first paint. */
  body.awaiting-mood #playbar.show{ display:block; }
  /* flex-basis 0, not auto: a canvas reports its BUFFER width as its intrinsic
     size, so `auto` let the buffer decide the layout that decides the buffer --
     the measured size changed every frame, the bake key with it, and the strip
     re-baked a thousand notes 60 times a second (41ms a frame). With basis 0 it
     simply takes the room that is left. */
  #playbar .pb-scrub canvas{ flex:1 1 0%; width:0; min-width:0; display:block;
    height:var(--ribh,44px); border-radius:5px;
    background:rgba(10,8,20,.55); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }
  /* The strip is a miniature of the editor's grid -- the same four lanes in the
     same colours -- so the way into the editor is to pull it up. The whole
     scrub row is the target; the chevron is there to say so. */
  #playbar .pb-scrub canvas{ cursor:pointer; transition:box-shadow .16s ease, transform .16s ease; }
  #playbar .pb-scrub:hover canvas{ box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),
    0 -6px 18px rgba(123,220,160,.13); transform:translateY(-1px); }
  #playbar .pb-expand{ position:absolute; right:6px; top:50%; transform:translateY(-50%);
    display:flex; align-items:center; gap:5px; padding:3px 7px; border-radius:7px;
    background:rgba(12,10,24,.78); color:var(--ink-2); pointer-events:none;
    font:600 10.5px/1 var(--ui); letter-spacing:.01em; opacity:0; transition:opacity .16s ease; }
  #playbar .pb-scrub:hover .pb-expand{ opacity:1; }

  /* The strip stays while the editor is open. The bar has to be the same height
     in both views or the thing contained above it jumps by the difference when

  body.gb-open #playbar .pb-scrub,

     Apple Music's centre is a small rounded panel: the track on one line, a
     thin scrubber under it, the clock at either end, and everything else kept

     It used to be four pills floating in the corners over the game. Asked for

     desk on the right -- what you are looking at, how fast, how loud, each

  /* ===== THE MACHINE'S OWN TYPE AND COLOUR ===========================
     Appended last on purpose: this is a wholesale re-facing of type and button
     colour across surfaces that were each styled locally, and fighting every
     one of those on specificity would leave the look dependent on the order
     somebody happens to edit them in later. */

  /* THE NAME, in the display face. Press Start 2P is about twice as wide per
     character as the system stack, so the old clamp(34-56px) put a 13-character
     title through the side of the screen. Roughly half the size, no negative
     tracking -- a pixel face has no kerning to tighten, and pulling the letters
     together only collides the stems. */
  body.awaiting-mood #rmoods .rmood-brand b{
    font-family:var(--pixel); font-weight:400; letter-spacing:0;
    font-size:clamp(16px,2.85vw,33px); line-height:1.3;
    text-shadow:0 3px 0 rgba(0,0,0,.5), 0 4px 32px rgba(0,0,0,.6); }

  /* EVERY CONTROL LABEL. Silkscreen was drawn for small sizes, which is what a
     button label is; Press Start 2P at 12px is a smear. Sizes come down a
     notch because a pixel face has no descender overshoot and reads larger at
     the same nominal size. */
  /* Descendants too. Every one of these labels is a <span> inside the button,
     and several carry their own `font:` shorthand -- which sets family, so
     setting it on the button alone left GitHub, Twitter, Hacker News, Display
     and Full screen sitting in the system stack inside pixel-font buttons. */
  /* FAMILY *AND* SIZE, ON THE DESCENDANTS.
     Setting a size on the button does nothing when the label is a <span> that
     carries its own `font:` shorthand -- the shorthand sets size, so the button
     grew and its text did not. Auditing the computed size of every visible
     string on the page found five different sizes still live: 14px on the
     subtitle, 13.5 on Full screen / Display / GitHub / Twitter / Hacker News,
     12.5 on the track name, 12 on the readouts, 11 on BPM and 10.5 on the
     clocks. One number, applied where the text actually is.
     The desktop thumbnail is excluded on purpose: its menu bar and dock are
     scenery inside a picture of a screen, not text to be read. */
  #presets .rbtn, #presets .rbtn *,
  #plinks .plink, #plinks .plink *, #plinks .plhead span,
  #madeby .plink, #madeby .plink *, #madeby .plmade-t, .plmade-t,
  #playbar button, #playbar button *, #playbar .pbd-lab, #playbar .pbd-read,
  #pbLcdTitle, #pbElapsed, #pbTotal, #playbar .pb-sub,
  #playbar .pb-expand, #bigplay .bp-cap,
  #rmoods .rmood-lab, #dlcard .dlc-h, #dlcard .dlc-d,
  #dlcard .dlc-b button, #dlcard .dlc-b button *,
  #rfullscreen, #rfullscreen *{
    font-family:var(--px) !important; letter-spacing:0 !important;
    font-size:var(--txt) !important; }
  /* the hero's name keeps the display face and its own scale */
  body.awaiting-mood #rmoods .rmood-brand b{ font-size:clamp(17px,4.9vw,25px) !important; }
  /* and the thumbnail's scenery keeps its tiny type */
  #dlcard .dlc-shot *, #dlcard .dlc-menu *, #dlcard .dlc-win *, #dlcard .dlc-dock *{
    font-size:6px !important; }

  /* BIGGER. Silkscreen is a bitmap face: it gets MORE legible as it grows,
     because at small sizes the strokes land between device pixels and blur,
     and the whole point of a pixel font is that the pixels are visible. These
     were set at the sizes the old proportional face used, which is the wrong
     scale for this type and made the page look timid as well as harder to
     read. Roughly +25%, with the boxes grown to match. */
  /* ANOTHER STEP UP. Silkscreen's cap height is small for its nominal size --
     a 14px Silkscreen reads like an 11px proportional face -- so sizes chosen
     against the old system stack land visually a third too small. Everything
     here is set from what it LOOKS like, not what the number says. */
  body.awaiting-mood #presets .rbtn.rmood{ font-size:var(--txt); padding:13px 18px; }
  body.awaiting-mood #rmoods .rmood-ask .rmood-lab{ font-size:var(--txt); }
  body:not(.awaiting-mood) #presets .rbtn.rmood{ font-size:var(--txt); padding:11px 16px; }
  body:not(.awaiting-mood) #rmoods .rmood-ask .rmood-lab{ font-size:var(--txt); }
  #plinks .plink-t, #plinks .plhead span, .plmade-t{ font-size:var(--txt); }
  /* the credit is one line: name then the three links. At 14px in a pixel face
     it outgrew the box it had and wrapped Hacker News onto the game. */
  #madeby{ max-width:min(96vw, 1100px); }
  #madeby .plmade-row{ flex-wrap:nowrap; }
  @media (max-width:1100px){ #madeby .plmade-row{ flex-wrap:wrap; } }
  #plinks .plink, #madeby .plink{ height:auto; min-height:52px; padding:13px 21px; }
  #rfullscreen{ font-size:var(--txt); }
  #playbar .pb-screen{ font-size:var(--txt); }
  #playbar .pbd-lab{ font-size:var(--txt); }
  #playbar .pbd-read, #pbElapsed, #pbTotal{ font-size:var(--txt); }
  #pbLcdTitle{ font-size:var(--txt); }
  #dlcard .dlc-h{ font-size:var(--txt); }
  #dlcard .dlc-d{ font-size:var(--txt); }
  #dlcard .dlc-b button{ font-size:var(--txt); height:48px; padding:0 20px; }
  /* the ask wraps to two rows at these sizes, which is fine, but the hero needs
     the room for the first row to hold most of the moods */
  body.awaiting-mood #rmoods .rmood-ask{ max-width:min(880px,90vw); gap:10px; }

  /* THE BUTTONS ARE THE A AND THE B. A DMG's action buttons are burgundy, and
     that is the one saturated colour on the whole machine -- so it is the one
     saturated colour here, reserved for the thing the page wants you to press.
     Everything else stays the dark material it already was. */
  body.awaiting-mood #presets .rbtn.rmood{
    background:linear-gradient(180deg, var(--gb-button-hi), var(--gb-button));
    border:1px solid rgba(0,0,0,.55); color:#ffe9f2;
