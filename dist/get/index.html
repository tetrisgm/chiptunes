  body.awaiting-mood #presets .rbtn.rmood:hover{
    background:linear-gradient(180deg, #bd3a79, #9a2760); color:#fff; }
  /* pressed, like a button that actually travels */
  body.awaiting-mood #presets .rbtn.rmood:active{
    transform:translateY(2px); box-shadow:0 0 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.15); }

  /* START and SELECT are the grey slanted pair, not another A button -- so the
     one control that is not "write me a song" does not dress like one. */
  body.awaiting-mood #presets .rbtn.rmood-scratch{
    background:linear-gradient(180deg, #7c7c88, #5d5d68) !important;
    border:1px solid rgba(0,0,0,.55) !important; color:#f2f2f6 !important; }
  body.awaiting-mood #presets .rbtn.rmood-scratch:hover{
    background:linear-gradient(180deg, #8d8d99, #6b6b77) !important; color:#fff !important; }

  /* the OS you are on, on the download card: the same A-button burgundy */
  #dlcard .dlc-b button:first-child{
    background:linear-gradient(180deg, var(--gb-button-hi), var(--gb-button));
    border-color:rgba(0,0,0,.5); color:#ffe9f2; }
  #dlcard .dlc-b button:first-child:hover{
    background:linear-gradient(180deg, #bd3a79, #9a2760); color:#fff; }

  /* the power lamp: it is red on the hardware and it means ON */
  #playbar .pb-play{ color:var(--gb-screen-0); }

  /* Pixel faces are drawn on a grid. Let them land on it. */
  #presets .rbtn, #plinks .plink, #playbar button, #dlcard .dlc-b button,
  #pbLcdTitle, #pbElapsed, #pbTotal{
    -webkit-font-smoothing:antialiased; text-rendering:optimizeSpeed; }

  /* ===== EVERY BUTTON IS A KEY ON THE MACHINE ========================
     The moods and the OS button got the moulded treatment and nothing else did,
     so the rail, the credit links and Full screen stayed flat glass sitting next
     to plastic. They are all keys now.

     NOT all burgundy. On a DMG only A and B are: the rest are the grey
     START/SELECT pills and the near-black D-pad. Making every control the
     saturated colour would be loud AND would throw away what the colour says --
     burgundy stays reserved for "this is the thing to press", which here is
     picking a mood.

     What makes a key read as physical is not colour anyway, it is the EDGE: a
     lit top face, a body that darkens downwards, a hard dark band along the
     bottom that is the thickness of the plastic, and travel when you press it.
     Those four things, on everything. */
  .plink, #rfullscreen, #dlcard .dlc-b button{
    /* THE SHELL'S OWN PLASTIC, NOT DARK UI WITH A BEVEL.
       These were charcoal, and charcoal is the one thing a Game Boy's face is
       NOT: the shell is warm light grey, and the only dark parts are the D-pad
       and the screen surround. A bevelled dark pill reads as a dark interface
       that has been embossed -- it does not read as the machine. Light grey
       plastic, moulded, with dark type on it does, immediately.
       Contrast goes UP, not down: near-black text on light grey is about 11:1,
       where the old pale text on charcoal was about 9:1. */
    background:linear-gradient(180deg, #e6e2d4 0%, #cdc9ba 38%, #b6b2a2 76%, #a09c8c 100%) !important;
    border:1px solid rgba(40,38,28,.55) !important;
    color:#23281c !important;
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.85),
      inset 0 -2px 3px rgba(90,86,70,.38),
      0 4px 0 #6f6c5e,
      0 5px 1px rgba(0,0,0,.45),
      0 9px 18px rgba(0,0,0,.4) !important;
    transition:transform .06s ease, box-shadow .06s ease,
               background .12s, color .12s, opacity .22s ease !important; }
  .plink:hover, #rfullscreen:hover, #dlcard .dlc-b button:hover{
    background:linear-gradient(180deg, #f2eee0 0%, #dbd7c8 38%, #c4c0b0 76%, #adaa99 100%) !important;
    color:#1a1e14 !important; }
  /* pressed: the key travels and the plastic edge under it disappears, because
     the top of the key has come down to meet it */
  .plink:active, #rfullscreen:active, #dlcard .dlc-b button:active{
    transform:translateY(4px) !important;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 2px 6px rgba(90,86,70,.5),
      0 0 0 #6f6c5e,
      0 2px 5px rgba(0,0,0,.4) !important; }
  /* the OS you are on, and the moods, keep the A/B burgundy -- same moulding */
  #dlcard .dlc-b button:first-child{
    background:linear-gradient(180deg, var(--gb-button-hi) 0%, var(--gb-button) 60%, #6d1a40 100%) !important;
    color:#ffe9f2 !important; }
  #dlcard .dlc-b button:first-child:hover{
    background:linear-gradient(180deg, #c33f80 0%, #a52c68 60%, #7d1f4a 100%) !important; }
  body.awaiting-mood #presets .rbtn.rmood,
  body:not(.awaiting-mood) #presets .rbtn.rmood{
    background:linear-gradient(180deg, var(--gb-button-hi) 0%, var(--gb-button) 60%, #6d1a40 100%);
    border:1px solid rgba(0,0,0,.62); color:#ffe9f2;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.24),
      inset 0 -1px 0 rgba(0,0,0,.4),
      0 3px 0 rgba(0,0,0,.5),
      0 6px 14px rgba(0,0,0,.4);
    transition:transform .06s ease, box-shadow .06s ease, background .12s, color .12s; }
  body.awaiting-mood #presets .rbtn.rmood:active,
  body:not(.awaiting-mood) #presets .rbtn.rmood:active{
    transform:translateY(3px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.12),
      inset 0 2px 6px rgba(0,0,0,.5),
      0 0 0 rgba(0,0,0,.5),
      0 2px 5px rgba(0,0,0,.4); }
  /* START and SELECT: the grey slanted pair, so the one control that is not
     "write me a song" does not dress like one */
  body.awaiting-mood #presets .rbtn.rmood-scratch,
  body:not(.awaiting-mood) #presets .rbtn.rmood-scratch{
    background:linear-gradient(180deg, #8b8b97 0%, #6e6e7a 58%, #55555f 100%) !important;
    color:#f4f4f8 !important; }
  body.awaiting-mood #presets .rbtn.rmood-scratch:hover,
  body:not(.awaiting-mood) #presets .rbtn.rmood-scratch:hover{
    background:linear-gradient(180deg, #9b9ba7 0%, #7d7d89 58%, #62626c 100%) !important; }
  /* the screen toggle when it is ON keeps the LCD green, but moulded like the rest */
  .plink.on{
    background:linear-gradient(180deg, #b9d43a 0%, #9bbc0f 45%, #86a30c 100%) !important;
    color:#16300f !important; border-color:rgba(30,50,15,.6) !important; }
  .plink.on:hover{
    background:linear-gradient(180deg, #c6e045 0%, #a8c916 45%, #92b00e 100%) !important; }
  /* the transport keys on the bar are keys too */
  #playbar .pb-main-ctrl button, #playbar .pb-screen{
    border-radius:999px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 2px 0 rgba(0,0,0,.42);
    transition:transform .06s ease, box-shadow .06s ease, background .12s, color .12s; }
  #playbar .pb-main-ctrl button:active, #playbar .pb-screen:active{
    transform:translateY(2px);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.45), 0 0 0 rgba(0,0,0,.42); }
  @media (prefers-reduced-motion:reduce){
    .plink:active, #rfullscreen:active, #dlcard .dlc-b button:active,
    #presets .rbtn.rmood:active, #playbar .pb-main-ctrl button:active,
    #playbar .pb-screen:active{ transform:none !important; }
  }

  /* Full screen lives in the bar now: same 34px box as the screen toggle and
     the mixer button beside it, not the 46px floating pill it was in the
     corner. */
  #playbar .pb-right #rfullscreen{
    display:inline-flex !important; height:34px !important; padding:0 12px !important;
    gap:7px !important; border-radius:999px; flex:0 0 auto;
    /* It was a 46px round icon button in the corner, and that fixed width
       survived the move: the label overflowed a 46px box and printed straight
       across "Display" beside it. In the bar it is a labelled pill and sizes to
       its text, like every other control in that cluster. */
    width:auto !important; min-width:0 !important;
    position:static !important; top:auto !important; right:auto !important;
    opacity:1 !important; transform:none !important; }

  @media (max-width:1000px){ #playbar .pb-right #rfullscreen .plink-t{ display:none; }
    #playbar .pb-right #rfullscreen{ padding:0 9px !important; } }

  /* THE DESKTOP CARD TAKES THE TOP-RIGHT, which Full screen has just vacated.
     It was bottom-right, above the bar, competing with the player for the one
     corner the eye goes to last. */
  #dlcard{ top:18px !important; bottom:auto !important; right:18px !important; }
  /* ...which means the credit row can no longer use the full width of the top
     strip: centred, it ran straight under the card and Hacker News disappeared
     behind it. */
  body:not(.awaiting-mood) #madeby{ max-width:calc(100vw - 430px); }
  @media (max-width:1100px){ body:not(.awaiting-mood) #madeby{ max-width:calc(100vw - 40px); } }

  /* ===== THE CARD HOLDS A SCREEN =====================================
     A bezel with nothing but dark inside it is a bezel around nothing. These
     cards are the device, so the text sits on the DMG's actual screen: the
     lightest of its four greens, the dot-matrix grid the panel simulates, the
     recess the glass sits in, and the darkest green for the type.

     The buttons stay OFF it, on the shell below -- which is where they are on
     the machine, and which is also what stops burgundy A/B keys from sitting on
     a green field and fighting it. */
  .gb-lcd{
    /* THE BLACK BEZEL, as a 13px ring rather than another element: the glass is
       inset into a dark surround which is itself inset into the shell. */
    position:relative; border-radius:5px; padding:20px 22px;
    margin:13px 13px 0;
    outline:13px solid #191a1d; outline-offset:0;
    /* the grid first, the glass under it */
    background-image:
      repeating-linear-gradient(0deg,  rgba(15,56,15,.20) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(15,56,15,.20) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, #a4c60f 0%, #9bbc0f 45%, #8bac0f 100%);
    box-shadow:
      inset 0 2px 7px rgba(15,56,15,.45),
      inset 0 -1px 0 rgba(255,255,255,.22),
      0 1px 0 rgba(255,255,255,.06);
    color:var(--gb-screen-3); }
  /* the faint corner shadowing of a cheap LCD under its polariser */
  .gb-lcd::after{
    content:''; position:absolute; inset:0; border-radius:6px; pointer-events:none;
    background:radial-gradient(ellipse 120% 100% at 50% 40%,
      rgba(15,56,15,0) 55%, rgba(15,56,15,.16) 100%); }
  .gb-lcd > *{ position:relative; z-index:1; }

  /* THE HERO'S NAME AND LINE ARE ON THE SCREEN. Everything on a Game Boy screen
     is drawn in the same pixel type, prose included -- so the subtitle joins the
     title here, at a size that stays readable. */
  body.awaiting-mood #rmoods .rmood-brand{
    border-radius:5px; padding:26px 30px 28px; gap:14px; max-width:none;
    margin:2px 2px 0; outline:14px solid #191a1d; outline-offset:0;
    background-image:
      repeating-linear-gradient(0deg,  rgba(15,56,15,.20) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(15,56,15,.20) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, #a4c60f 0%, #9bbc0f 45%, #8bac0f 100%);
    box-shadow:
      inset 0 2px 8px rgba(15,56,15,.45),
      inset 0 -1px 0 rgba(255,255,255,.22); }
  body.awaiting-mood #rmoods .rmood-brand b{
    color:var(--gb-screen-3) !important;
    text-shadow:0 1px 0 rgba(255,255,255,.28) !important; }
  body.awaiting-mood #rmoods .rmood-brand i{
    font-family:var(--px) !important; letter-spacing:0;
    font-size:var(--txt); line-height:1.7; color:#1d4a1d;
    text-shadow:0 1px 0 rgba(255,255,255,.22); max-width:none; }

  /* the download card's heading and line, on the same screen */
  #dlcard .gb-lcd{ padding:13px 14px 14px; margin-bottom:12px; }
  #dlcard .gb-lcd .dlc-h{ color:var(--gb-screen-3);
    text-shadow:0 1px 0 rgba(255,255,255,.28); }
  #dlcard .gb-lcd .dlc-d{ font-family:var(--px) !important; font-size:var(--txt);
    line-height:1.7; letter-spacing:0; color:#1d4a1d; margin-top:6px;
    text-shadow:0 1px 0 rgba(255,255,255,.2); }

  /* THE TWO BARE LABELS HAVE NO SURFACE UNDER THEM.
     Everything else on the picture is a key or a card with its own background;
     these two are raw text on whatever the game happens to be drawing, and on
     the Game Boy face -- a cream field -- white type with a soft dark glow
     nearly vanished. A hard 1px outline in every direction reads on a light
     field AND a dark one, which is the only thing that can be true of a label
     sitting on fourteen different games. */
  .plmade-t,
  body:not(.awaiting-mood) #rmoods .rmood-ask .rmood-lab{
    color:#fff !important;
    text-shadow:
      1px 1px 0 rgba(0,0,0,.92), -1px 1px 0 rgba(0,0,0,.92),
      1px -1px 0 rgba(0,0,0,.92), -1px -1px 0 rgba(0,0,0,.92),
      0 2px 7px rgba(0,0,0,.75) !important; }

  /* ===== PROPORTIONS, AND WHAT SITS ON THE SHELL =====================
     A DMG's front is roughly: screen block on top, a band of shell, then the
     controls, then more shell with the speaker in the corner. The card had the
     buttons jammed against the screen with nothing under them, which is why it
     read as a panel rather than a device. */
  /* the case needs room UNDER the controls: the grille lives down there and was
     printing through the last button */
  body.awaiting-mood #rmoods{
    padding:16px 16px 58px; gap:0; max-width:min(880px,90vw); }
  /* the stripe sits between the screen and the controls, and the controls are
     inset from the case edge the way the buttons are on the machine */
  body.awaiting-mood #rmoods > .gb-stripe{ order:0; margin:13px 15px 0; }
  body.awaiting-mood #rmoods .rmood-ask{ order:1; }
  body.awaiting-mood #rmoods .rmood-brand{ order:-1; }
  body.awaiting-mood #rmoods > .gb-speaker{ order:2; }
  body.awaiting-mood #rmoods .rmood-brand{ margin-bottom:0; }
  /* the band of shell between the screen and the controls */
  body.awaiting-mood #rmoods .rmood-ask{ margin-top:24px; padding:0 14px 4px;
    max-width:none; row-gap:12px; }
  /* the ask reads ON the shell now, so it is dark type on plastic, not white
     type with an outline meant for a game behind it */
  body.awaiting-mood #rmoods .rmood-ask .rmood-lab{
    color:#2b2f22 !important; text-shadow:0 1px 0 rgba(255,255,255,.5) !important; }
  /* room under the controls for the case to be a case, and for the speaker */
  body.awaiting-mood #rmoods::after{ display:none; }

  /* the download card, same anatomy at a smaller scale */
  #dlcard{ padding:12px 12px 46px; }
  #dlcard .gb-lcd{ margin:1px 1px 0; outline-width:11px; padding:12px 13px 13px; }
  #dlcard .dlc-shot{ margin-top:26px; }
  #dlcard .dlc-b{ margin-top:14px; padding:0 2px; }
  #dlcard .gb-speaker{ right:18px; bottom:11px; width:56px; height:26px; }

  /* ===== IT IS A PORTRAIT MACHINE ====================================
     The card was a console squashed into a letterbox: a DMG is about 90 x 148mm
     -- markedly TALLER than it is wide -- with a screen that is nearly square
     (47 x 43mm). Stretched to 880px wide with a 100px-tall screen it read as a
     novelty, which is exactly what it looked like.
     Stood up: a narrow case, a near-square screen, and the controls stacked
     underneath it the way a menu sits under a Game Boy's screen. */
  body.awaiting-mood #rmoods{
    width:min(500px, 93vw); max-width:none;
    /* the deep shell below the controls is not padding for its own sake: on the
       machine that band carries START/SELECT and the speaker, and without it the
       case reads as cropped just under the buttons */
    padding:15px 15px 112px; }
  /* the screen: near-square, and the type sized for a 380px-wide panel rather
     than an 800px one */
  /* Sized from the real thing rather than by eye: the DMG's visible LCD is
     47 x 43mm, so the screen is 1.09:1, and the case is 90 x 148mm, so it is
     0.61:1. At 412px of inner screen width that is 378px of height, and the
     case lands near 730 tall for its 444 wide. Measured after: 0.61 and 1.09. */
  body.awaiting-mood #rmoods .rmood-brand{
    min-height:378px; justify-content:center; padding:22px 20px;
    outline-width:13px; margin:1px 1px 0; }
  body.awaiting-mood #rmoods .rmood-brand b{
    font-size:clamp(17px,4.9vw,25px) !important; line-height:1.45 !important; }
  body.awaiting-mood #rmoods .rmood-brand i{
    font-size:var(--txt) !important; line-height:1.7 !important; }
  /* the controls, stacked under the screen. Three or four to a row in this
     width, which is what a menu on this machine looks like anyway. */
  body.awaiting-mood #rmoods .rmood-ask{
    margin-top:26px; padding:0 8px; row-gap:9px; gap:8px; justify-content:center;
    align-items:center; }
  /* START, on its own row under the rest, which is where it is on the case */
  body.awaiting-mood #presets .rbtn.rmood-scratch{
    order:9; flex-basis:100%; margin:15px auto 0; max-width:230px; }
  body.awaiting-mood #presets .rbtn.rmood{ font-size:var(--txt); padding:12px 17px; }
  /* Still on the same line as the first mood, which was an explicit request and
     still FITS: the label is ~230px and a pill ~90px in a 412px row. Stacking it
     as a centred heading would look tidier now the case is portrait -- but that
     is a different instruction from the one that was given, and it is not mine
     to change by preference. */
  body.awaiting-mood #rmoods .rmood-ask .rmood-lab{
    font-size:var(--txt); margin:0 2px 0 0; }
  body.awaiting-mood #rmoods > .gb-stripe{ margin:12px 13px 0; }
  body.awaiting-mood #rmoods > .gb-speaker{ right:22px; bottom:20px; width:84px; height:42px; opacity:.55; }
  /* short windows: give the screen back some height rather than scrolling */
  /* Short windows keep the case rather than the ratio: a Game Boy you have to
     scroll is worse than a slightly stubby one. */
  @media (max-height:900px){
    body.awaiting-mood #rmoods .rmood-brand{ min-height:300px; }
    body.awaiting-mood #rmoods{ padding-bottom:48px; } }
  @media (max-height:800px){
    body.awaiting-mood #rmoods .rmood-brand{ min-height:228px; padding:18px 18px; }
    body.awaiting-mood #rmoods{ padding-bottom:44px; } }
  @media (max-height:700px){
    body.awaiting-mood #rmoods .rmood-brand{ min-height:160px; padding:14px 16px; }
    body.awaiting-mood #rmoods .rmood-brand i{ font-size:13px !important; line-height:1.7 !important; } }

  /* ===== ONE BUTTON SIZE =============================================
     Applied last so it beats the per-context sizes that accumulated, and
     applied to every control that reads as a button: the rail, the credit
     links, Full screen, the moods, the OS keys, the screen toggle and the
     transport. */
  .plink, #rfullscreen, #dlcard .dlc-b button,
  #presets .rbtn.rmood, #playbar .pb-screen{
    height:var(--btn-h) !important; min-height:var(--btn-h) !important;
    padding:0 var(--btn-px) !important; gap:var(--btn-gap) !important;
    border-radius:999px !important;
    display:inline-flex !important; align-items:center !important;
    justify-content:center !important; }
  /* the rail's labels wrap on narrow windows, so those grow downwards instead
     of clipping -- the one place a fixed height would do harm */
  @media (max-width:900px){
    #plinks .plink{ height:auto !important; padding:12px var(--btn-px) !important; } }
  /* icon-only controls: the same height, square */
  #playbar .pb-main-ctrl button, #playbar .pb-volume, #playbar .pb-adv,
  #playbar .pb-heart-inline,
  /* the play button carried its own body-scoped !important at 38px and so sat
     out the standardisation -- it is the same key as prev and next */
  body.ai-visual #playbar .pb-play, #playbar .pb-play{
    width:var(--btn-h) !important; height:var(--btn-h) !important;
    min-width:var(--btn-h) !important; border-radius:50% !important; padding:0 !important; }
  #playbar .pb-main-ctrl button svg, #playbar .pb-volume svg, #playbar .pb-adv svg{
    width:22px !important; height:22px !important; }
  #playbar .pb-screen svg, .plink svg, #rfullscreen svg, #dlcard .dlc-b button svg{
    width:20px !important; height:20px !important; }
  /* the advanced-volume button was dimmed to half-opacity to make it recede;
     one family means one weight, so it reads like its neighbours */
  #playbar .pb-adv{ opacity:.9 !important; }
  #playbar .pb-adv:hover{ opacity:1 !important; }
</style>

  <div id="intro">

      <h1>CHIPTUNES<span style="color:var(--accent)">.APP</span></h1>

    </div>

    <button id="start" hidden></button>
  </div>

  <div id="popover"></div>
  <div id="browse"></div>

<script src="../app.82673556939a.js" defer></script>
